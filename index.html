<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#0e7a43"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Signale"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>*{box-sizing:border-box}body{margin:0}</style><title>Signal-Karteikarten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: Kopfzeile mit Fortschritt, Filter nach Schwierigkeit, Raster aus Signaltafel-Kacheln; Karte öffnet als Sheet mit Frage, Antwort-Button unten. */
:root {
  --bg: #edf0ea;
  --surface: #fbfcfa;
  --ink: #15211b;
  --muted: #5d6b62;
  --line: #d3dad2;
  --tint: #e3ebe2;
  --accent: #0e7a43;
  --on-accent: #ffffff;
  --leicht: #2e9d5f;
  --mittel: #d9a400;
  --schwer: #c63a30;
  --danger: #b3261e;
  --plate: #f1f3ee;
  --plate-ink: #3b463f;
  --overlay: rgba(10, 18, 14, 0.55);
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.04), 0 8px 20px -12px rgba(20, 40, 30, 0.4);
  --font-d: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --font-b: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1411; --surface: #17201b; --ink: #e7eee8; --muted: #9aa89f; --line: #2a362f; --tint: #1f2b24;
    --accent: #3fb877; --on-accent: #08140d; --leicht: #4cbf7b; --mittel: #e8b923; --schwer: #ef6a5e; --danger: #ff8a80;
    --overlay: rgba(0, 0, 0, 0.65); --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 8px 20px -12px rgba(0, 0, 0, 0.8);
    color-scheme: dark;
  }
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] {
  --bg: #0e1411; --surface: #17201b; --ink: #e7eee8; --muted: #9aa89f; --line: #2a362f; --tint: #1f2b24;
  --accent: #3fb877; --on-accent: #08140d; --leicht: #4cbf7b; --mittel: #e8b923; --schwer: #ef6a5e; --danger: #ff8a80;
  --overlay: rgba(0, 0, 0, 0.65); --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 8px 20px -12px rgba(0, 0, 0, 0.8);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 16px/1.5 var(--font-b);
  padding-inline: 16px; padding-block: 20px 40px;
}
.wrap { max-width: 960px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header { display: flex; flex-direction: column; gap: 10px; }
.kicker { font: 600 13px/1 var(--font-b); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
h1 { font: 700 clamp(34px, 8vw, 52px)/0.95 var(--font-d); margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
.progress { display: flex; flex-direction: column; gap: 6px; }
.progress-text { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--tint); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }

.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; font-weight: 500; font-size: 15px;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.headrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.themebtn { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 500; }
.stat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat-box { border: 1.5px solid var(--line); border-radius: 10px; padding: 10px; background: var(--surface); min-width: 0; }
.stat-box b { display: block; font: 700 26px/1.1 var(--font-d); font-variant-numeric: tabular-nums; }
.stat-box span { font-size: 12px; color: var(--muted); }
.srow { display: grid; grid-template-columns: 44px minmax(0, 1fr) 92px; gap: 10px; align-items: center; font-size: 14px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.srow:last-child { border-bottom: 0; }
.srow .k { font-weight: 700; }
.srow .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.sbar { height: 8px; background: var(--tint); border-radius: 4px; overflow: hidden; }
.sbar > i { display: block; height: 100%; background: var(--accent); }
.sbar.warn > i { background: var(--schwer); }
.hist { margin: 0; padding: 0; list-style: none; font-size: 14px; }
.hist li { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.hist li span:last-child { margin-left: auto; font-weight: 600; }
.winp { width: 100%; min-height: 46px; padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font: 400 16px/1.4 var(--font-b); }
textarea.winp { min-height: 96px; resize: vertical; }
.winp:disabled { opacity: .85; }
.wfield { display: flex; flex-direction: column; gap: 6px; }
.verdict { font-size: 14px; padding: 8px 12px; border-radius: 10px; background: var(--tint); }
.verdict.ok { border-left: 4px solid var(--accent); }
.verdict.bad { border-left: 4px solid var(--danger); }
.verdict b { font-weight: 700; }
.dot.schreib { background: var(--accent); }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; min-height: 48px; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-size: 15px; line-height: 1.4; }
.opt[disabled] { cursor: default; }
.opt.ok { border-color: var(--accent); background: var(--tint); font-weight: 600; }
.opt.bad { border-color: var(--danger); color: var(--danger); }
.res-big { font: 700 44px/1 var(--font-d); }
.wrong-list { margin: 0; padding-left: 20px; font-size: 14px; color: var(--muted); }
.pickbtn { justify-content: flex-start; gap: 10px; }
.chip-mark { margin-left: 4px; }
.chip .star { color: #d99a00; font-size: 16px; line-height: 1; }
.chip[aria-pressed="true"] .star { color: #ffd34d; }
.tile .mk { position: absolute; left: 7px; bottom: 4px; font-size: 18px; line-height: 1; color: #d99a00; }
.mark-btn { width: 44px; height: 44px; border: 0; background: transparent; font-size: 26px; line-height: 1; color: var(--muted); border-radius: 10px; }
.mark-btn.on { color: #d99a00; }
.chip .n { font-variant-numeric: tabular-nums; opacity: .7; font-size: 13px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--muted); }
.dot.leicht { background: var(--leicht); } .dot.pzb { background: #1565d8; } .dot.info { background: #0e7a43; }
.tile.info::before { background: repeating-linear-gradient(90deg, #0e7a43 0 10px, #9bd3b3 10px 20px); }
.info-text { white-space: pre-line; }
.info-h { font-weight: 700; font-size: 13px; letter-spacing: .06em; color: var(--accent); margin-top: 4px; }
.sig svg[aria-label="Skizze Weichenbereich"] { height: auto; width: min(380px, 100%); }
.sig:has(svg[aria-label="Skizze Weichenbereich"]) { width: 100%; } .dot.oz { background: #7a5c9e; } .dot.mittel { background: var(--mittel); } .dot.schwer { background: var(--schwer); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }

.btn {
  min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1.5px solid var(--accent);
  background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 16px;
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
.btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: var(--surface); }
.btn.wide { flex: 1; }
.btn[disabled] { opacity: .4; cursor: default; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.gsec { margin: 0 0 26px; }
.gsec h2 { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin: 0 0 10px; font: 700 28px/1 var(--font-d); letter-spacing: .01em; }
.gsec h2 .gt { font: 500 14px/1.2 var(--font-b); color: var(--muted); }
.gsec h2 .gn { margin-left: auto; font: 500 13px/1 var(--font-b); color: var(--muted); font-variant-numeric: tabular-nums; }
.sel { width: 100%; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; }
.tile {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  aspect-ratio: 1 / 1.1; padding: 12px 6px 8px; background: var(--surface); border: 1.5px solid var(--line);
  border-radius: 6px; box-shadow: var(--shadow); overflow: hidden; min-width: 0;
}
.tile::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 8px; background: var(--muted); }
.tile.leicht::before { background: var(--leicht); } .tile.pzb::before { background: #1565d8; } .tile.oz::before { background: #7a5c9e; } .tile.mittel::before { background: var(--mittel); } .tile.schwer::before { background: var(--schwer); }
.tile .num { font: 700 38px/1 var(--font-d); font-variant-numeric: tabular-nums; margin-top: 6px; }
.tile .lbl { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.tile.known { background: var(--tint); }
.tile .ok { position: absolute; right: 6px; bottom: 6px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.empty { padding: 28px 0; color: var(--muted); }
.sigs { display: flex; flex-wrap: wrap; gap: 10px; }
.sig { margin: 0; background: var(--plate); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: 100%; min-width: 0; }
.sig svg { height: 140px; width: auto; max-width: 100%; display: block; }
.sig svg[aria-label="PZB-Leuchtmelder"] { height: auto; width: min(366px, 100%); }
.sig:has(svg[aria-label="PZB-Leuchtmelder"]) { width: 100%; }
.sig figcaption { font-size: 12px; line-height: 1.3; color: var(--plate-ink); text-align: center; font-weight: 500; }
.sig img { max-height: 180px; max-width: 100%; display: block; border-radius: 4px; }
.imgfield { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.imgfield img { max-height: 160px; max-width: 100%; border-radius: 8px; border: 1px solid var(--line); background: var(--plate); }
.filebtn { display: inline-flex; align-items: center; cursor: pointer; }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.filebtn:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.look { margin: 10px 0 0; font-size: 15px; color: var(--muted); overflow-wrap: anywhere; white-space: pre-line; }

/* Sheet */
.overlay { position: fixed; inset: 0; background: var(--overlay); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
.overlay[hidden] { display: none !important; }
.panel {
  width: 100%; max-width: 620px; max-height: 100%; display: flex; flex-direction: column; background: var(--surface);
  border-radius: 14px 14px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: var(--shadow);
}
@media (min-width: 700px) { .overlay { align-items: center; padding: 24px; } .panel { border-radius: 14px; max-height: 92%; } }
.ptop { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
@media (min-width: 700px) { .ptop { padding-top: 14px; } }
.badge { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.pos { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; margin-left: auto; }
.icon-btn { min-width: 44px; min-height: 44px; border: 0; background: transparent; font-size: 26px; line-height: 1; border-radius: 8px; }
.link-btn { min-height: 44px; border: 0; background: transparent; color: var(--accent); font-weight: 600; font-size: 15px; padding: 0 6px; }
.pbody { padding: 18px 18px 8px; overflow-y: auto; min-height: 180px; flex: 1; display: flex; flex-direction: column; gap: 14px; }
.field-label { font: 600 12px/1 var(--font-b); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; display: block; }
.q { font: 600 clamp(24px, 6vw, 30px)/1.2 var(--font-d); margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.a { background: var(--tint); border-radius: 10px; padding: 14px 16px; margin: 0; font-size: 17px; overflow-wrap: anywhere; white-space: pre-wrap; }
.pfoot { display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 16px; }
.row { display: flex; gap: 10px; }
.nav { display: flex; justify-content: space-between; }

.form { display: flex; flex-direction: column; gap: 14px; }
textarea, .form input[type="text"] {
  width: 100%; min-height: 96px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px;
  background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--font-b); resize: vertical;
}
textarea.tall { min-height: 150px; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg button { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1.5px solid var(--line); background: transparent; font-weight: 500; }
.seg button[aria-pressed="true"] { border-color: var(--ink); background: var(--tint); font-weight: 600; }
.note { font-size: 14px; color: var(--muted); margin: 0; }
.msg { font-size: 14px; margin: 0; min-height: 1.4em; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 15px; z-index: 20; max-width: 90%;
}
.toast[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div class="headrow"><div class="kicker">DS 301 · Signalbuch</div><button class="themebtn" id="themeBtn" type="button"></button></div>
    <h1>Signal-Karteikarten</h1>
    <div class="progress">
      <div class="progress-text" id="progressText"></div>
      <div class="bar" aria-hidden="true"><i id="progressBar"></i></div>
    </div>
  </header>

  <div class="controls">
    <div class="chips" id="gchips" role="group" aria-label="Block"></div>
    <div class="chips" id="chips" role="group" aria-label="Schwierigkeitsgrad"></div>
    <div class="tools">
      <button class="btn" id="addBtn" type="button">Neue Karte</button>
      <button class="btn ghost" id="testBtn" type="button">Test (20 Fragen)</button>
      <button class="btn ghost" id="statBtn" type="button">Statistik</button>
    </div>
  </div>

  <main>
    <div id="grid"></div>
    <p class="empty" id="empty" hidden>In dieser Stufe gibt es noch keine Karten. Mit „Neue Karte“ legst du eine an.</p>
  </main>
</div>

<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

 bedeutet das Signal?", "answer": "Es folgt eine vorübergehende Langsamfahrstelle, auf der die angezeigte Geschwindigkeit nicht überschritten werden darf.", "sig": ["lf1"], "look": "Tageszeichen: auf der Spitze stehende dreieckige gelbe Scheibe mit weißem Rand und schwarzer Kennziffer (bei beschränktem Raum kann die Spitze nach oben zeigen). Nachtzeichen: unter dem beleuchteten Tageszeichen zwei schräg nach links steigende gelbe Lichter (bei beschränktem Raum vor dem Tageszeichen).", "group": "Lf"}, {"difficulty": "leicht", "question": "Lf 2 (Anfangscheibe) – Was bedeutet das Signal?", "answer": "Anfang der vorübergehenden Langsamfahrstelle.", "sig": ["lf2"], "look": "Eine rechteckige, auf der Schmalseite stehende oder quadratische gelbe Scheibe mit weißem Rand und schwarzem A.", "group": "Lf"}, {"difficulty": "leicht", "question": "Lf 3 (Endscheibe) – Was bedeutet das Signal?", "answer": "Ende der vorübergehenden Langsamfahrstelle.", "sig": ["lf3"], "look": "Eine rechteckige, auf der Schmalseite stehende oder quadratische weiße Scheibe mit schwarzem E.", "group": "Lf"}, {"difficulty": "leicht", "question": "Lf 4 (Geschwindigkeitstafel) – Was bedeutet das Signal?", "answer": "Es folgt eine ständige Langsamfahrstelle, auf der die angezeigte Geschwindigkeit nicht überschritten werden darf.", "sig": ["lf4"], "look": "Eine auf der Spitze stehende dreieckige weiße Tafel mit schwarzem Rand und schwarzer Kennziffer. Bei beschränktem Raum kann die Dreieckspitze nach oben zeigen.", "group": "Lf"}, {"difficulty": "leicht", "question": "Lf 5 (Anfangstafel) – Was bedeutet das Signal?", "answer": "Die auf der Geschwindigkeitstafel (Lf 4) angezeigte Geschwindigkeitsbeschränkung muss durchgeführt sein.", "sig": ["lf5"], "look": "Eine rechteckige, auf der Schmalseite stehende weiße Tafel mit schwarzem A.", "group": "Lf"}, {"difficulty": "leicht", "question": "Lf 6 (Geschwindigkeits-Ankündesignal) – Was bedeutet das Signal?", "answer": "Ein Geschwindigkeitssignal (Lf 7) ist zu erwar "sig": ["lf7"], "group": "Lf"}, {"difficulty": "schwer", "question": "Wo stehen Überwachungssignale bei den Eisenbahnen des Bundes?", "answer": "In der Regel im Abstand des Bremsweges der Strecke vor dem Bahnübergang.", "sig": ["bue0"], "group": "Bü"}, {"difficulty": "schwer", "question": "Wo stehen Überwachungssignale bei nichtbundeseigenen Eisenbahnen?", "answer": "In der Regel in einem für das Abbremsen ausreichenden Abstand rechts neben dem Gleis. Auf Anordnung des Betriebsleiters auch links sowie unmittelbar vor dem Bahnübergang.", "sig": ["bue0"], "group": "Bü"}, {"difficulty": "schwer", "question": "Wie wird ein Überwachungssignal im verkürzten Bremswegabstand gekennzeichnet?", "answer": "Durch ein rückstrahlendes, auf der Spitze stehendes weißes Dreieck mit schwarzem Rand. Gilt bei Eisenbahnen des Bundes, wenn der Abstand um mehr als 5 % kürzer ist als der Bremsweg der Strecke.", "sig": ["bue_kurz"], "group": "Bü"}, {"difficulty": "schwer", "question": "Wie wird ein Überwachungssignalwiederholer gekennzeichnet?", "answer": "Durch eine weiß umrandete schwarze quadratische Tafel mit runder weißer Scheibe.", "sig": ["bue_wdh"], "group": "Bü"}, {"difficulty": "schwer", "question": "Was gilt für die Pfeiftafel (Bü 4), wenn zwischen Bü 4 und dem Bahnübergang ein Halteplatz liegt?", "answer": "Über der vor dem Halteplatz stehenden Pfeiftafel ist eine rechteckige weiße Tafel mit zwei senkrechten schwarzen Streifen angebracht. Die Pfeiftafel gilt nur für Züge, die vor dem Bahnübergang nicht halten.", "sig": ["bue4_halt"], "group": "Bü"}, {"difficulty": "schwer", "question": "Was zeigt die gelbe, schwarz umrandete Bü-Ankündetafel?", "answer": "Sie steht am Anfang der Einschaltstrecke und weist auf die Lage des zugehörigen Bahnübergangs mit Blinklichtern oder Lichtzeichen hin.", "sig": ["ankuende"], "group": "Bü"}, {"difficulty": "schwer", "question": "Was zeigt die weiße Bü-Kennzeichentafel?", "answer": "Sie steht unmittelbar vor dem zugehörigen Bahnübergang mit Blinklichtern oder Lichtzeichen (bei einer Ankündigung durch die Bü-Ankündetafel).", "sig": ["kennz"], "group": "Bü"}, {"difficulty": "schwer", "question": "Wie wird der Anfang einer gemeinsamen Einschaltstrecke für mehrere Bahnübergänge angezeigt?", "answer": "Durch eine weiße rückstrahlende Tafel mit schwarzer Aufschrift „Bü/Bü“ über der Bü-Ankündetafel für den ersten zugehörigen Bahnübergang.", "sig": ["buebue"], "group": "Bü"}, {"difficulty": "schwer", "question": "Was ist innerhalb einer gemeinsamen Einschaltstrecke vor jedem zugehörigen Bahnübergang aufgestellt?", "answer": "Außer der Bü-Kennzeichentafel die Bü-Ankündetafel für den folgenden zugehörigen Bahnübergang. Der letzte Bahnübergang ist nur mit einer Bü-Kennzeichentafel gekennzeichnet.", "sig": ["innerhalb"], "group": "Bü"}, {"difficulty": "schwer", "question": "Für wen gelten die Signale Lf 1, Lf 2 und Lf 3?", "answer": "Für Züge und Rangierfahrten. Sie sind nicht ortsfest und dürfen bei den Eisenbahnen des Bundes nur auf besonderen Auftrag des Eisenbahninfrastrukturunternehmers aufgestellt werden.", "sig": ["lf1", "lf2", "lf3"], "group": "Lf"}, {"difficulty": "schwer", "question": "Wann werden keine Langsamfahrsignale aufgestellt?", "answer": "Wenn die reduzierte Geschwindigkeit nur für einzelne Zuggattungen bzw. Züge gilt. Dann gibt das Infrastrukturunternehmen die Geschwindigkeitsreduzierung den betroffenen Zügen schriftlich bekannt.", "sig": [], "group": "Lf"}, {"difficulty": "schwer", "question": "Wie wird Lf 1 bzw. Lf 6 ergänzt, wenn die Langsamfahrstelle nach einer Strecken- oder Fahrwegverzweigung beginnt?", "answer": "Durch einen gelben Richtungspfeil mit schwarzem Rand, der anzeigt, für welche Richtung die Geschwindigkeitsbeschränkung gilt. Bei Lf 2 wird der Richtungspfeil wiederholt, wenn auch Lf 2 vor der Verzweigung steht.", "sig": ["lf1_pfeil", "lf6_pfeil"], "group": "Lf"}, {"difficulty": "schwer", "question": "Was bedeutet die Tafel „BÜ“ unter Lf 3 bzw. Lf 7?", "answer": "Die Geschwindigkeit darf erhöht werden, wenn das führende Fahrzeug die Mitte des Bahnübergangs erreicht hat.", "sig": ["lf3_bue", "lf7_bue"], "group": "Lf"}, {"difficulty": "schwer", "question": "Wo wird Lf 4 aufgestellt?", "answer": "1) Wo die zulässige Geschwindigkeit vor der ständigen Langsamfahrstelle um 25 % und mehr größer ist als auf der Langsamfahrstelle. 2) Wo am Vorsignal angezeigt werden soll, dass vom zugehörigen Hauptsignal ab bei Hp 1 die angezeigte Geschwindigkeit nicht überschritten werden darf. 3) Wo die Geschwindigkeit vor Bahnübergängen ermäßigt werden muss.", "sig": ["lf4"], "group": "Lf"}, {"difficulty": "schwer", "question": "Wo wird Lf 5 aufgestellt?", "answer": "Nur auf Nebenbahnen, dort wo es erforderlich ist, vor Bahnübergängen die Stelle besonders zu kennzeichnen, von der ab die mit Lf 4 angezeigte Geschwindigkeit gilt.", "sig": ["lf5"], "group": "Lf"}, {"difficulty": "schwer", "question": "Bis wann gilt die Geschwindigkeitsbeschränkung vor einem Bahnübergang (Lf 4)?", "answer": "Sie muss am Signal Lf 5 (wo es nicht aufgestellt ist: vor dem Bahnübergang) durchgeführt sein und ist beizubehalten, bis das erste Fahrzeug etwa die Straßenmitte erreicht hat.", "sig": ["lf4", "lf5"], "group": "Lf"}, {"difficulty": "schwer", "question": "Wann gilt ein an einem Hauptsignal aufgestelltes Lf 7?", "answer": "Nur bei Stellung Hp 1, Ks 1 ohne Zs 3 oder Ks 2 ohne Zs 3.", "sig": ["lf7"], "group": "Lf"}, {"difficulty": "schwer", "question": "Wann liegt ein zu signalisierender Geschwindigkeitswechsel (Lf 7) auch vor?", "answer": "Wenn an Abzweigstellen und an Streckenverzweigungen in Bahnhöfen beim Übergang von einer Strecke auf eine andere eine Geschwindigkeitsänderung zu beachten ist.", "sig": [], "group": "Lf"}, {"difficulty": "schwer", "question": "Wie werden Lf-Signale bei Dunkelheit sichtbar gemacht?", "answer": "Sie sind bei Dunkelheit beleuchtet oder rückstrahlend. Bei Lf 1 zeigt das Nachtzeichen zwei schräg nach links steigende gelbe Lichter; eine rückstrahlende gelb ", "answer": "Formsignal – Tageszeichen: Die runde Scheibe steht senkrecht, der Flügel zeigt schräg nach rechts abwärts. Nachtzeichen: Ein gelbes Licht und nach rechts steigend ein grünes Licht. Lichtsignal: Ein gelbes Licht und nach rechts steigend ein grünes Licht.", "sig": ["vr2_form", "vr2_licht"], "group": "Vr"}, {"difficulty": "mittel", "question": "Wie sieht Hp 0 aus?", "answer": "Formsignal – Tageszeichen: Ein Signalflügel (bei zweiflügeligen Signalen der obere Flügel) zeigt waagerecht nach rechts. Nachtzeichen: Ein rotes Licht. Lichtsignal: Ein rotes oder zwei rote Lichter nebeneinander. Hp 0 wird am Hauptsignal oder auch am Lichtsperrsignal gezeigt.", "sig": ["hp0_form", "hp0_licht1", "hp0_licht2"], "group": "Hp"}, {"difficulty": "mittel", "question": "Wie sieht Hp 1 aus?", "answer": "Formsignal – Tageszeichen: Ein Signalflügel (bei zweiflügeligen Signalen der obere Flügel) zeigt schräg nach rechts aufwärts. Nachtzeichen: Ein grünes Licht. Lichtsignal: Ein grünes Licht.", "sig": ["hp1_form", "hp1_licht"], "group": "Hp"}, {"difficulty": "mittel", "question": "Wie sieht Hp 2 aus?", "answer": "Formsignal – Tageszeichen: Zwei Signalflügel zeigen schräg nach rechts aufwärts. Nachtzeichen: Ein grünes Licht und senkrecht darunter ein gelbes Licht. Lichtsignal: Ein grünes Licht und senkrecht darunter ein gelbes Licht.", "sig": ["hp2_form", "hp2_licht"], "group": "Hp"}, {"difficulty": "mittel", "question": "Wie sieht Ks 1 aus?", "answer": "Ein grünes Licht. Am Vorsignal sind die Signaloptiken quer, am Hauptsignal senkrecht angebracht.", "sig": ["ks1_haupt", "ks1_vor"], "group": "Ks"}, {"difficulty": "mittel", "question": "Wie sieht Ks 2 aus?", "answer": "Ein gelbes Licht. Am Vorsignal sind die Signaloptiken quer, am Hauptsignal (mit Vorsignalfunktion) drei Signaloptiken angebracht.", "sig": ["ks2_vor", "ks2_haupt_vf"], "group": "Ks"}, {"difficulty": "mittel", "question": "Was zeigen Vorsignale an?", "answer": "Welches Signalbild am zugehörigen Hauptsignal zu erwarten ist.", "group": "Vr"}, {"difficulty": "mittel", "question": "Was zeigen Hauptsignale an?", "answer": "Ob der anschließende Gleisabschnitt befahren werden darf.", "group": "Hp"}, {"difficulty": "mittel", "question": "Was ist ein Wärtervorsignal?", "answer": "Ein ortsfestes Vorsignal ohne bewegliche Elemente. Es kennzeichnet den Beginn des Bremswegabstandes zu einem Hauptsignal. Auf dem Foto der Präsentation: runde orange Scheibe mit schwarzem Rand, dazu zwei orange Lampen.", "sig": ["waerter"], "group": "Vr"}, {"difficulty": "mittel", "question": "Wie wird ein alleinstehendes Vorsignal gekennzeichnet?", "answer": "Mit der Vorsignaltafel (Signal Ne 2). In der Präsentation: weiße, rechteckige Tafel mit schwarzem Kreuz.", "sig": ["ne2"], "group": "Vr"}, {"difficulty": "mittel", "question": "Wie sehen Vorsignalbaken (Ne 3) aus und wofür stehen sie?", "answer": "Weiße Tafeln mit schrägen schwarzen Balken: drei, zwei und ein Balken. Sie kündigen das Vorsignal an. Abstände laut Präsentation: 75 m zwischen der ersten und zweiten Bake, 75 m zwischen der zweiten und dritten Bake, 100 m von der letzten Bake bis zum Vorsignal.", "sig": ["ne3"], "group": "Vr"}, {"difficulty": "mittel", "question": "Als was können Kombinationssignale (Ks) verwendet werden, und woran erkennt man das?", "answer": "Als Vorsignal: Signaloptiken quer angebracht, Vorsignaltafel Ne 2 (außer beim Vorsignalwiederholer). Als Hauptsignal: Signaloptiken senkrecht angebracht, Mastschild. Als Hauptsignal mit Vorsignalfunktion: drei Signaloptiken, Mastschild und ein gelbes Dreieck für die Vorsignalfunktion.", "sig": ["ks1_vor", "ks1_haupt", "ks2_haupt_vf"], "group": "Ks"}, {"difficulty": "schwer", "question": "Welche Arten von Vorsignalen gibt es?", "answer": "Ortsfeste Licht- oder Formsignale oder Wärtersignale.", "sig": ["vr0_licht", "vr0_form", "waerter"], "group": "Vr"}, {"difficulty": "schwer", "question": "Wie sind Licht- und Formvorsignale aufgebaut?", "answer": "Lichtsignale mit einem oder zwei Lichtern als Tages- und Nachtzeichen, oder Formsignale mit einer klappbaren gelben runden Scheibe (schwarzer Ring mit weißem Rand). Unter der Scheibe kann sich ein beweglicher pfeilförmiger Flügel befinden.", "sig": ["vr0_form", "vr0_licht"], "group": "Vr"}, {"difficulty": "schwer", "question": "Wie lange müssen die Nachtzeichen der Formhauptsignale leuchten?", "answer": "In der Regel so lange, wie Züge in die betreffende Fahrtrichtung verkehren.", "group": "Vr"}, {"difficulty": "schwer", "question": "In welchem Abstand stehen Vorsignale zum zugehörigen Hauptsignal?", "answer": "Im Bremswegabstand der Strecke laut „StreBu“.", "group": "Vr"}, {"difficulty": "schwer", "question": "Wie wird ein Lichtvorsignal im verkürzten Bremswegabstand gekennzeichnet?", "answer": "Steht es in einem um mehr als 5 % verkürzten Bremswegabstand der Strecke, so ist es mit einem weißen Zusatzlicht links in Höhe des rechten Signallichts kenntlich.", "sig": ["vr_kurz"], "group": "Vr"}, {"difficulty": "schwer", "question": "Wie wird eine alleinstehende Vorsignaltafel (Ne 2) im verkürzten Bremswegabstand gekennzeichnet?", "answer": "Mit einem weißen Dreieck, das auf der Spitze steht. Es gilt bei einem um mehr als 5 % verkürzten Bremswegabstand.", "sig": ["ne2_kurz"], "group": "Vr"}, {"difficulty": "schwer", "question": "Was ist ein Vorsignalwiederholer?", "answer": "Ist die Sicht auf ein Hauptsignal behindert, kann das Lichtvorsignal wiederholt sein. Der Vorsignalwiederholer zeigt das gleiche Signalbild wie das zurückgelegene Vorsignal und ist durch ein weißes Zusatzlicht gekennzeichnet. Er hat keine Vorsignaltafel und wird nicht durch Vorsignalbaken (Ne 3) angekündigt.", "sig": ["vr_wdh"], "group": "Vr"}, {"difficulty": "schwer", "question": "Welche Signalarten gibt es bei Hauptsignalen?", "answer": "Lichtsignale mit einem oder zwei Lichtern als Tages- und Nachtzeichen, oder Formsignale mit einem oder zwei Flügeln als Tageszeichen und ebenso vielen Lichtern als Nachtzeichen.", "sig": ["hp0_licht2", "hp0_form"], "group": "Hp"}, {"difficulty": "schwer", "question": "Als was werden Hauptsignale verwendet?", "answer": "Signale des Bahnhofs: Einfahrsignale (Esig), Zwischensignale (Zsig), Ausfahrsignale (Asig). Signale der freien Strecke: Blocksignale (Bksig), Deckungssignale (Dksig).", "group": "Hp"}, {"difficulty": "schwer", "question": "Wo stehen Hauptsignale im Verhältnis zum Gleis?", "answer": "Im Bahnhof rechts vom Gleis. Auf der freien Strecke: bei eingleisigen Strecken rechts vom Gleis, bei zweigleisigen Strecken rechts vom Regelgleis und links vom Gegengleis.", "group": "Hp"}, {"difficulty": "schwer", "question": "Wie sind Licht- und Formhauptsignale gekennzeichnet?", "answer": "Lichthauptsignale durch Mastschilder. Die Maste der Formhauptsignale sind zur besseren Erkennbarkeit rot-weiß gekennzeichnet (Mastblech, nicht Mastschild).", "sig": ["hp1_licht", "hp1_form"], "group": "Hp"}, {"difficulty": "schwer", "question": "Wie können Lichthauptsignal und Lichtvorsignal angeordnet sein?", "answer": "An einem gemeinsamen Signalträger. Das Hauptsignal befindet sich immer über dem Vorsignal, und es wird keine Vorsignaltafel aufgestellt.", "group": "Hp"}, {"difficulty": "schwer", "question": "In welchem Abstand stehen mehrere Signale mit gemeinsamem Signalträger?", "answer": "1000 m bis 1300 m (Bezugsgröße ist ein Bremswegabstand von 1000 m). Der Abstand darf den Bremswegabstand um bis zu 50 % überschreiten.", "group": "Hp"}, {"difficulty": "schwer", "question": "Wann ist das Vorsignal am gemeinsamen Signalträger dunkel geschaltet?", "answer": "Bei „Hp 0“ oder wenn das Vorsignal für den folgenden Fahrweg nicht benötigt wird.", "group": "Hp"}, {"difficulty": "schwer", "question": "Wie wird ein Hauptsignal identifiziert?", "answer": "Es hat einen eindeutigen Signalnamen, der gegenüber dem Fahrdienstleiter immer anzugeben ist (Beispiel in der Präsentation: Signal „Gustav“).", "group": "Hp"}, {"difficulty": "schwer", "question": "Für wen gilt Hp 0?", "answer": "Für Zug- und Rangierfahrten. Vor „Halt“ müssen alle Fahrtbewegungen anhalten.", "sig": ["hp0_licht2"], "group": "Hp"}, {"difficulty": "schwer", "question": "Für wen gelten Hp 1 und Hp 2?", "answer": "Nur für Zugfahrten. Eine Zugfahrt ist nach Fahrplan verkehrend und hat sich zuvor „Fahrbereit“ beim Fahrdienstleiter fertig gemeldet.", "sig": ["hp1_licht", "hp2_licht"], "group": "Hp"}, {"difficulty": "schwer", "question": "Was gilt für Rangierfahrten vor Hauptsignalen?", "answer": "Eine Rangierfahrt muss vor Hauptsignalen in „Fahrtstellung“ anhalten. Zeigt ein Hauptsignal bei Annäherung noch Fahrt, ist anzuhalten und das Signal „Hp 0“ abzuwarten. Für die Vorbeifahrt an einem Hauptsignal ist immer die Zustimmung des Weichenwärters erforderlich.", "group": "Hp"}, {"difficulty": "schwer", "question": "Mit welcher Geschwindigkeit darf der Tf bei Hp 1 fahren?", "answer": "Mit der Geschwindigkeit, die im Buchfahrplan angegeben ist. Das gilt nur, wenn es nicht durch andere Signale oder durch schriftliche Anweisungen anders geregelt ist.", "sig": ["hp1_licht"], "group": "Hp"}, {"difficulty": "schwer", "question": "Mit welcher Geschwindigkeit darf der Tf bei Hp 2 fahren?", "answer": "Mit höchstens 40 km/h in den anschließenden Weichenbereich, wenn dies durch andere Signale oder Einträge im Buchfahrplan/La nicht verschärft oder gelockert wurde.", "sig": ["hp2_licht"], "group": "Hp"}, {"difficulty": "schwer", "question": "Wie kann Hp 2 verschärft oder gelockert werden?", "answer": "Durch einen Eintrag im Buchfahrplan („E 50/60“, „Z 50/60“ oder „A 50/60“), durch das Signal Zs 3 oder durch einen La-Eintrag.", "sig": ["zs3"], "group": "Hp"}, {"difficulty": "schwer", "question": "Was erlaubt Ks 2 am Hauptsignal?", "answer": "Es erlaubt die Vorbeifahrt am Hauptsignal und kündigt Halt an. Die Geschwindigkeit richtet sich nach dem Buchfahrplan Spalte 2, wenn sie nicht durch andere Signale oder Einträge eingeschränkt ist.", "sig": ["ks2_haupt_vf"], "group": "Ks"}, {"difficulty": "schwer", "question": "Wann zeigt ein Vorsignalwiederholer bei Ks ein weißes Zusatzlicht unter dem Signallicht?", "answer": "Bei „Ks 1 + Zs 3v“ und bei „Ks 2“. Bei „Ks 1“ ohne weitere Einschränkungen leuchtet das untere Zusatzlicht nicht.", "sig": ["ks_wdh"], "group": "Ks"}, {"difficulty": "leicht", "question": "El 1v – Was bedeutet das Signal?", "answer": "Signal El 1 erwarten.", "sig": ["el1v"], "look": "Zwei weiße Rechtecke waagerecht nebeneinander.", "group": "El"}, {"difficulty": "leicht", "question": "El 1 (Ausschaltsignal) – Was bedeutet das Signal?", "answer": "Ausschalten.", "sig": ["el1"], "look": "Ein zerlegtes weißes U.", "group": "El"}, {"difficulty": "leicht", "question": "El 2 (Einschaltsignal) – Was bedeutet das Signal?", "answer": "Einschalten erlaubt.", "sig": ["el2"], "look": "Ein geschlossenes weißes U.", "group": "El"}, {"difficulty": "leicht", "question": "El 3 („Bügel ab“-Ankündesignal) – Was bedeutet das Signal?", "answer": "Signal „Bügel ab“ erwarten.", "sig": ["el3"], "look": "Zwei in der Höhe gegeneinander versetzte weiße Streifen.", "group": "El"}, {"difficulty": "leicht", "question": "El 4 („Bügel ab“-Signal) – Was bedeutet das Signal?", "answer": "Bügel ab.", "sig": ["el4"], "look": "Ein waagerechter weißer Streifen.", "group": "El"}, {"difficulty": "leicht", "question": "El 5 („Bügel an“-Signal) – Was bedeutet das Signal?", "answer": "Bügel an.", "sig": ["el5"], "look": "Ein senkrechter weißer Streifen.", "group": "El"}, {"difficulty": "leicht", "question": "El 6 – Was bedeutet das Signal?", "answer": "Halt für Fahrzeuge mit gehobenen Stromabnehmern.", "sig": ["el6"], "look": "Ein auf der Spitze stehender quadratischer weißer Rahmen mit innenliegendem weißem Quadrat.", "group": "El"}, {"difficulty": "mittel", "question": "Wie sieht El 1v aus?", "answer": "Zwei weiße Rechtecke waagerecht nebeneinander.", "sig": ["el1v"], "group": "El"}, {"difficulty": "mittel", "question": "Wie sieht El 1 aus?", "answer": "Ein zerlegtes weißes U.", "sig": ["el1"], "group": "El"}, {"difficulty": "mittel", "question": "Wie sieht El 2 aus?", "answer": "Ein geschlossenes weißes U.", "sig": ["el2"], "group": "El"}, {"difficulty": "mittel", "question": "Wie sieht El 3 aus?", "answer": "Zwei in der Höhe gegeneinander versetzte weiße Streifen.", "sig": ["el3"], "group": "El"}, {"difficulty": "mittel", "question": "Wie sieht El 4 aus?", "answer": "Ein waagerechter weißer Streifen.", "sig": ["el4"], "group": "El"}, {"difficulty": "mittel", "question": "Wie sieht El 5 aus?", "answer": "Ein senkrechter weißer Streifen.", "sig": ["el5"], "group": "El"}, {"difficulty": "mittel", "question": "Wie sieht El 6 aus?", "answer": "Ein auf der Spitze stehender quadratischer weißer Rahmen mit innenliegendem weißem Quadrat.", "sig": ["el6"], "group": "El"}, {"difficulty": "mittel", "question": "Wie ist die Zusatztafel bei einem Systemwechsel (El 2) aufgebaut?", "answer": "Auf der Zusatztafel befindet sich eine weiße Sinuskurve (Wechselstromsystem-Anfang) oder zwei waagerechte weiße Streifen (Gleichstromsystem-Anfang). Über der Sinuskurve kann eine Zahl (Spannung) gezeigt werden.", "sig": ["el2_ac", "el2_dc"], "group": "El"}, {"difficulty": "mittel", "question": "Was zeigt die Zusatztafel mit Kennbuchstaben bei El 3 und El 4?", "answer": "Einen weißen Kennbuchstaben. Er gibt an, für welche Fahrtrichtung das Signal El 3 oder El 4 gilt. Der Infrastrukturunternehmer gibt die verwendeten Kennbuchstaben bekannt; sie sind in den örtlichen Zusätzen enthalten.", "sig": ["el3_b", "el4_b"], "group": "El"}, {"difficulty": "mittel", "question": "Was gilt, wenn El 3 und El 4 für mehrere Fahrtrichtungen zu beachten sind?", "answer": "Die Signale können mit zwei Zusatztafeln ergänzt sein. Diese Zusatztafeln sind ein Drittel kleiner als die Signaltafel. Die Kennbuchstaben können auch in einer Zusatztafel übereinander gezeigt werden.", "sig": ["el4_b2", "el4_bl"], "group": "El"}, {"difficulty": "mittel", "question": "Was zeigt die Zusatztafel bei El 6 (Profilwechsel)?", "answer": "Eine weiße Länderkennung (z. B. „D“ für Deutschland oder „CH“ für Schweiz). Darunter kann die Spannung der Fahrleitung gezeigt werden. El 6 mit Zusatztafel gilt nur für Fahrzeuge, deren gehobener Stromabnehmer der angezeigten nationalen Bauart entspricht.", "sig": ["el6_d", "el6_ch"], "group": "El"}, {"difficulty": "schwer", "question": "Welche Fahrleitungssignale (El 1v, El 1, El 2) sind ortsfest, und wann gibt es veränderliche?", "answer": "Die Signale El 1v, El 1 und El 2 sind ortsfest. Wo Fahrleitungs-Schutzstrecken nur zeitweilig das Ausschalten der Triebfahrzeuge erfordern, ist für die Einfahrt in die Schutzstrecke ein veränderliches Aus- und Einschaltsignal (El 1/El 2) vorhanden.", "group": "El"}, {"difficulty": "schwer", "question": "Wo steht El 1v, und wann wird es nicht gezeigt?", "answer": "El 1v befindet sich grundsätzlich im halben Abstand des Bremswegs der Strecke vor dem Signal El 1. Bei einfachen örtlichen Verhältnissen wird es nicht gezeigt.", "sig": ["el1v"], "group": "El"}, {"difficulty": "schwer", "question": "Was gilt am Signal El 1?", "answer": "Am Signal muss das Ausschalten beendet sein.", "sig": ["el1"], "group": "El"}, {"difficulty": "schwer", "question": "Was gilt, wenn El 1 und El 2 am gleichen Standort stehen?", "answer": "El 1 kann mit El 2 am gleichen Standort vereinigt sein; El 2 befindet sich dann über El 1. Das Triebfahrzeug muss spätestens am Standort des Signals ausgeschaltet sein und darf nach der Vorbeifahrt am Signal und Wiederkehr der Fahrleitungsspannung wieder eingeschaltet werden. Die vereinigten Signale El 1 und El 2 sind bei Dunkelheit beleuchtet.", "sig": ["el1_el2"], "group": "El"}, {"difficulty": "schwer", "question": "Wann darf das Triebfahrzeug nach El 2 wieder eingeschaltet werden?", "answer": "Nach der Vorbeifahrt am Signal. Bei einem Systemwechsel (Zusatztafel) darf das Triebfahrzeug erst nach dem Systemwechsel wieder eingeschaltet werden.", "sig": ["el2"], "group": "El"}, {"difficulty": "schwer", "question": "Wo kann das Einschaltsignal El 2 außerhalb der DB AG stehen?", "answer": "Auf eingleisigen Strecken unmittelbar links neben dem Gleis.", "group": "El"}, {"difficulty": "schwer", "question": "Wo steht El 3, und was kündigt es an?", "answer": "El 3 kündigt das „Bügel ab“-Signal (El 4) an. Es befindet sich in der Regel im halben Abstand des Bremswegs der Strecke vor dem „Bügel ab“-Signal.", "sig": ["el3"], "group": "El"}, {"difficulty": "schwer", "question": "Wann wird El 3 wiederholt?", "answer": "Wenn Züge hinter dem Signal El 3 beginnen oder ihre Fahrt fortsetzen, ist ein zweites Signal El 3 aufgestellt. Der Standort des zweiten Signals wird in der La bekannt gegeben.", "group": "El"}, {"difficulty": "schwer", "question": "Was kennzeichnet El 4, und wo steht es?", "answer": "El 4 kennzeichnet den Beginn eines Gleisabschnitts, der nur mit gesenkten Stromabnehmern befahren werden darf. Am Signal müssen die Stromabnehmer völlig gesenkt sein. Das Signal befindet sich 30 m vor dem mit gesenkten Stromabnehmern zu befahrenden Fahrleitungs-Abschnitt.", "sig": ["el4"], "group": "El"}, {"difficulty": "schwer", "question": "Was kennzeichnet El 5, und wo steht es?", "answer": "El 5 kennzeichnet das Ende eines Gleisabschnitts, der mit gesenkten Stromabnehmern befahren werden muss. Das Signal befindet sich 30 m hinter dem mit gesenkten Stromabnehmern zu befahrenden Fahrleitungs-Abschnitt.", "sig": ["el5"], "group": "El"}, {"difficulty": "schwer", "question": "Wann dürfen nach El 5 die Stromabnehmer wieder angelegt werden?", "answer": "Nach Vorbeifahrt am Signal. Der Triebfahrzeugführer darf mit dem Anlegen erst beginnen, wenn das Triebfahrzeug am Signal vorbeigefahren ist. Bei einem Systemwechsel (Zusatztafel) dürfen die Stromabnehmer erst nach dem Systemwechsel wieder angelegt werden.", "sig": ["el5"], "group": "El"}, {"difficulty": "schwer", "question": "Welche Ausnahme gilt beim Anlegen des Stromabnehmers vor El 5?", "answer": "Ist es für das Anfahren eines zum Halten gekommenen Triebfahrzeuges erforderlich, darf in bestimmten Gleisen der Stromabnehmer vor dem Signal El 5 gehoben werden, wenn sich der Fahrdraht im Arbeitsbereich des Stromabnehmers befindet. Die betreffenden Gleise sind in den örtlichen Zusätzen angegeben.", "group": "El"}, {"difficulty": "schwer", "question": "Wo kann das „Bügel an“-Signal (El 5) außerhalb der DB AG stehen?", "answer": "Auf eingleisigen Strecken unmittelbar links neben dem Gleis.", "group": "El"}, {"difficulty": "schwer", "question": "Was kann außerhalb der DB AG auf der Rückseite von El 4 gezeigt werden?", "answer": "Das Signal El 4 kann auf der Rückseite das Signal El 5 zeigen.", "group": "El"}, {"difficulty": "schwer", "question": "Was gilt für El 3, El 4 und El 5 bezüglich Standort, Geltung und Beleuchtung?", "answer": "Die Signale können auch nicht ortsfest sein. Gelten sie für bestimmte Gleise oder Fahrtrichtungen nicht, ist dies in den örtlichen Zusätzen bekannt gegeben. Sie sind bei Dunkelheit beleuchtet; bei einfachen Verhältnissen kann darauf verzichtet werden.", "group": "El"}, {"difficulty": "schwer", "question": "Was ist am Signal El 6 verboten?", "answer": "Fahrten über das Signal hinaus sind für Triebfahrzeuge mit gehobenen Stromabnehmern verboten.", "sig": ["el6"], "group": "El"}, {"difficulty": "schwer", "question": "Wer regelt das Vorbeifahren der Spitze eines Triebfahrzeugs mit gehobenem Stromabnehmer am Signal El 6?", "answer": "Der Eisenbahninfrastrukturunternehmer darf das Vorbeileiten der Spitze eines Triebfahrzeugs mit gehobenem Stromabnehmer zulassen. Der Eisenbahnverkehrsunternehmer regelt, unter welchen Bedingungen und wie die Vorbeifahrt am Signal El 6 erfolgen darf.", "group": "El"}, {"difficulty": "schwer", "question": "Wie ist El 6 bei Dunkelheit zu erkennen?", "answer": "Das Signal ist rückstrahlend oder beleuchtet, wenn der Betrieb es erfordert. Die betreffenden Gleise sind in den örtlichen Zusätzen angegeben.", "group": "El"}, {"difficulty": "leicht", "question": "Fz 1 (Rangierlokomotivsignal) – Was bedeutet das Signal?", "answer": "Kennzeichnung einer Lokomotive im Rangierdienst.", "sig": ["fz1"], "look": "Tageszeichen: kein besonderes Signal.\nNachtzeichen: vorn und hinten ein weißes Licht in Höhe der Puffer.\nStattdessen kann auch Zg 1a geführt werden.", "group": "Fz"}, {"difficulty": "leicht", "question": "Fz 2 (Gelbe Fahne) – Was bedeutet das Signal?", "answer": "Kennzeichnung von Wagen, die während eines Stilllagers mit Personal besetzt sind.", "sig": ["fz2"], "look": "Tageszeichen: an jeder Langseite des Wagens eine gelbe Fahne oder gelbe Tafel.\nNachtzeichen: das Tageszeichen; außerdem der Wagen nach außen erkennbar im Inneren beleuchtet.", "group": "Fz"}, {"difficulty": "leicht", "question": "Zg 1 (Spitzensignal) – Was bedeutet das Signal?", "answer": "Kennzeichnung der Zugspitze.", "sig": ["zg1a", "zg1b"], "look": "Tageszeichen: kein besonderes Signal.\nNachtzeichen: Zg 1a (drei weiße Lichter in Form eines A) oder Zg 1b (zwei weiße Lichter in gleicher Höhe).", "group": "Zg"}, {"difficulty": "leicht", "question": "Zg 1a (Dreilicht-Spitzensignal) – Wo und wann wird es geführt?", "answer": "Vorn am ersten Fahrzeug, wenn dieses ein Triebfahrzeug oder Steuerwagen ist: drei weiße Lichter in Form eines A.", "sig": ["zg1a"], "group": "Zg"}, {"difficulty": "leicht", "question": "Zg 1b – Wo und wann wird es geführt?", "answer": "Vorn am ersten Fahrzeug, wenn dieses nicht ein Triebfahrzeug oder Steuerwagen ist: zwei weiße Lichter in gleicher Höhe.", "sig": ["zg1b"], "group": "Zg"}, {"difficulty": "leicht", "question": "Zg 2 (Schlusssignal) – Was bedeutet das Signal?", "answer": "Kennzeichnung des Zugschlusses.", "sig": ["zg2", "zg2s"], "look": "Am letzten Fahrzeug zwei rote Lichter\noder zwei rechteckige reflektierende Schilder mit weißen Dreiecken seitlich und je einem roten Dreieck oben und unten, die mit ihren Spitzen sich in der Mitte des Schildes berühren. Die roten Lichter dürfen blinken.", "group": "Zg"}, {"difficulty": "mittel", "question": "Wie sieht Fz 1 bei Nacht aus?", "answer": "Vorn und hinten ein weißes Licht, in Höhe der Puffer. Am Tag: kein besonderes Signal.", "sig": ["fz1"], "group": "Fz"}, {"difficulty": "mittel", "question": "Wie sieht Fz 2 aus?", "answer": "Am Tag: an jeder Langseite des Wagens eine gelbe Fahne oder gelbe Tafel. Bei Nacht zusätzlich: Wagen nach außen erkennbar im Inneren beleuchtet.", "sig": ["fz2"], "group": "Fz"}, {"difficulty": "mittel", "question": "Wie sieht Zg 1a aus?", "answer": "Drei weiße Lichter in Form eines A (zwei unten, eins oben).", "sig": ["zg1a"], "group": "Zg"}, {"difficulty": "mittel", "question": "Wie sieht Zg 1b aus?", "answer": "Zwei weiße Lichter in gleicher Höhe.", "sig": ["zg1b"], "group": "Zg"}, {"difficulty": "mittel", "question": "Wie sieht Zg 2 aus?", "answer": "Zwei rote Lichter am letzten Fahrzeug – oder zwei rechteckige reflektierende Schilder: weiß mit seitlichen weißen Dreiecken, rotes Dreieck oben und unten, Spitzen berühren sich in der Mitte.", "sig": ["zg2", "zg2s", "zg2sd"], "group": "Zg"}, {"difficulty": "schwer", "question": "Wofür sind die Signale an einzelnen Fahrzeugen (Fz) da?", "answer": "Sie kennzeichnen Rangierlokomotiven und Fahrzeuge, deren Besetzung besondere Vorsichtsmaßnahmen erfordert.", "group": "Fz"}, {"difficulty": "schwer", "question": "Wofür sind die Signale an Zügen (Zg) da?", "answer": "Sie kennzeichnen Züge und auf die freie Strecke übergehende Nebenfahrzeuge mit Kraftantrieb.", "group": "Zg"}, {"difficulty": "schwer", "question": "Wer führt Fz 1 außer Rangierlokomotiven?", "answer": "Auch Nebenfahrzeuge mit Kraftantrieb im Rangierdienst führen das Signal.", "sig": ["fz1"], "group": "Fz"}, {"difficulty": "schwer", "question": "Wann muss statt Fz 1 das Signal Zg 1a geführt werden?", "answer": "Wenn beim Rangieren Bahnübergänge ohne technische Sicherung oder ohne Sicherung durch Posten befahren werden. Zg 1a wird dann auch bei Tage geführt. Sonst kann Zg 1a freiwillig statt Fz 1 geführt werden.", "sig": ["zg1a"], "group": "Fz"}, {"difficulty": "schwer", "question": "Wann wird Fz 2 geführt, und wer bringt es an?", "answer": "Solange die Wagen sich nicht im Zuge befinden. Das Signal wird vom Personal der Wagen angebracht.", "sig": ["fz2"], "group": "Fz"}, {"difficulty": "schwer", "question": "Wer führt Zg 1b außer Wagen an der Zugspitze?", "answer": "Nebenfahrzeuge, an denen wegen ihrer niedrigen Bauart das obere Licht des Signals Zg 1a nicht angebracht werden kann, führen Zg 1b.", "sig": ["zg1b"], "group": "Zg"}, {"difficulty": "schwer", "question": "Was gilt für das Spitzensignal bei nachgeschobenen Zügen?", "answer": "Bei nachgeschobenen Zügen trägt auch das Schiebebetriebfahrzeug das Spitzensignal, sofern es nicht mit dem Zug gekuppelt ist.", "sig": ["zg1a"], "group": "Zg"}, {"difficulty": "schwer", "question": "Wann sind die Nachtzeichen des Spitzensignals (Zg 1) zu führen?", "answer": "Die Nachtzeichen sind auch bei Tage zu führen.", "sig": ["zg1a", "zg1b"], "group": "Zg"}, {"difficulty": "schwer", "question": "Dürfen die roten Lichter des Schlusssignals (Zg 2) blinken?", "answer": "Ja, die roten Lichter dürfen blinken.", "sig": ["zg2"], "group": "Zg"}, {"difficulty": "leicht", "question": "Wn 1 – Was bedeutet das Signal?", "answer": "Gerader Zweig.", "sig": ["wn1f", "wn1l"], "look": "Von der Weichenspitze oder vom Herzstück aus gesehen.\nFormsignal: ein auf der Schmalseite stehendes weißes Rechteck auf schwarzem Grund.\nLichtsignal: zwei übereinander stehende weiße Lichter.", "group": "Wn"}, {"difficulty": "leicht", "question": "Wn 2 – Was bedeutet das Signal?", "answer": "Gebogener Zweig.", "sig": ["wn2f", "wn2fr", "wn2l"], "look": "Von der Weichenspitze aus gesehen.\nFormsignal: ein weißer Pfeil oder Streifen auf schwarzem Grund zeigt entsprechend der Ablenkung schräg nach links oder rechts aufwärts.\nLichtsignal: zwei nebeneinander stehende weiße Lichter.", "group": "Wn"}, {"difficulty": "leicht", "question": "Wn 3 – Was bedeutet das Signal?", "answer": "Gerade von links nach rechts.", "sig": ["wn3f", "wn3l"], "look": "Formsignal: die Pfeile oder Streifen bilden eine von links nach rechts steigende Linie.\nLichtsignal: die Lichter bilden eine von links nach rechts steigende Linie.", "group": "Wn"}, {"difficulty": "leicht", "question": "Wn 4 – Was bedeutet das Signal?", "answer": "Gerade von rechts nach links.", "sig": ["wn4f", "wn4l"], "look": "Formsignal: die Pfeile oder Streifen bilden eine von rechts nach links steigende Linie.\nLichtsignal: die Lichter bilden eine von rechts nach links steigende Linie.", "group": "Wn"}, {"difficulty": "leicht", "question": "Wn 5 – Was bedeutet das Signal?", "answer": "Bogen von links nach links.", "sig": ["wn5f", "wn5l"], "look": "Formsignal: die Pfeile oder Streifen bilden einen nach links geöffneten rechten Winkel.\nLichtsignal: die Lichter bilden einen nach links geöffneten rechten Winkel.", "group": "Wn"}, {"difficulty": "leicht", "question": "Wn 6 – Was bedeutet das Signal?", "answer": "Bogen von rechts nach rechts.", "sig": ["wn6f", "wn6l"], "look": "Formsignal: die Pfeile oder Streifen bilden einen nach rechts geöffneten rechten Winkel.\nLichtsignal: die Lichter bilden einen nach rechts geöffneten rechten Winkel.", "group": "Wn"}, {"difficulty": "leicht", "question": "Wn 7 – Was bedeutet das Signal?", "answer": "Die Gleissperre ist abgelegt.", "sig": ["wn7"], "look": "Ein senkrechter, schwarzer Streifen in einer runden, weißen Scheibe auf schwarzem Grund.", "group": "Wn"}, {"difficulty": "leicht", "question": "Wn 2 vom Herzstück aus gesehen – Wie sieht es aus?", "answer": "Bei einfachen Weichen und Innenbogenweichen: eine runde weiße Scheibe auf schwarzem Grund.", "sig": ["wnHz"], "group": "Wn"}, {"difficulty": "leicht", "question": "Wn 2 vom Herzstück aus gesehen bei Außenbogenweichen – Wie sieht es aus?", "answer": "Eine nach links oder rechts geöffnete Sichel auf runder weißer Scheibe mit schwarzem Grund.", "sig": ["wnHzS", "wnHzSr"], "group": "Wn"}, {"difficulty": "mittel", "question": "Wie sieht Wn 1 aus?", "answer": "Formsignal: weißes Rechteck auf der Schmalseite, schwarzer Grund. Lichtsignal: zwei weiße Lichter übereinander.", "sig": ["wn1f", "wn1l"], "group": "Wn"}, {"difficulty": "mittel", "question": "Wie sieht Wn 2 aus?", "answer": "Formsignal: weißer Pfeil/Streifen schräg nach links oder rechts aufwärts. Lichtsignal: zwei weiße Lichter nebeneinander.", "sig": ["wn2f", "wn2fr", "wn2l"], "group": "Wn"}, {"difficulty": "mittel", "question": "Wie sieht Wn 3 aus?", "answer": "Von links nach rechts steigende Linie aus Pfeilen/Streifen bzw. Lichtern.", "sig": ["wn3f", "wn3l"], "group": "Wn"}, {"difficulty": "mittel", "question": "Wie sieht Wn 4 aus?", "answer": "Von rechts nach links steigende Linie aus Pfeilen/Streifen bzw. Lichtern.", "sig": ["wn4f", "wn4l"], "group": "Wn"}, {"difficulty": "mittel", "question": "Wie sieht Wn 5 aus?", "answer": "Nach links geöffneter rechter Winkel aus Pfeilen/Streifen bzw. Lichtern.", "sig": ["wn5f", "wn5l"], "group": "Wn"}, {"difficulty": "mittel", "question": "Wie sieht Wn 6 aus?", "answer": "Nach rechts geöffneter rechter Winkel aus Pfeilen/Streifen bzw. Lichtern.", "sig": ["wn6f", "wn6l"], "group": "Wn"}, {"difficulty": "mittel", "question": "Wie sieht Wn 7 aus?", "answer": "Senkrechter schwarzer Streifen in runder weißer Scheibe auf schwarzem Grund.", "sig": ["wn7"], "group": "Wn"}, {"difficulty": "schwer", "question": "Wofür sind Weichensignale (Wn) da?", "answer": "Sie zeigen an, für welchen Fahrweg die Weiche gestellt ist.", "group": "Wn"}, {"difficulty": "schwer", "question": "Wie sind Weichensignale bei Dunkelheit zu erkennen?", "answer": "Sie sind entweder rückstrahlend oder, wenn der Betrieb es erfordert, bei Dunkelheit beleuchtet.", "group": "Wn"}, {"difficulty": "schwer", "question": "Was zeigen Lichtsignale der Weichensignale während des Umstellvorgangs oder bei Störung der Weiche?", "answer": "Mindestens ein weißes Licht blinkt. Bei den Eisenbahnen des Bundes blinken zwei weiße Lichter.", "group": "Wn"}, {"difficulty": "schwer", "question": "Wie werden Weichensignale an Rückfallweichen dargestellt?", "answer": "Die weißen Symbole der Signale Wn 1 und Wn 2 werden auf orangefarbenem Grund dargestellt.", "sig": ["wn1l", "wn2l"], "group": "Wn"}, {"difficulty": "schwer", "question": "Welchen Zweig zeigt Wn 1 bzw. Wn 2 bei Innenbogenweichen an?", "answer": "Wn 1: den schwächer gebogenen Zweig. Wn 2: den stärker gebogenen Zweig.", "sig": ["wn1f", "wn2f"], "group": "Wn"}, {"difficulty": "schwer", "question": "Welches Signal gilt bei Außenbogenweichen?", "answer": "In beiden Stellungen wird Wn 2 verwendet; der Pfeil zeigt je nach Richtung des abzweigenden Gleises nach links oder rechts schräg aufwärts.", "sig": ["wn2f", "wn2fr"], "group": "Wn"}, {"difficulty": "schwer", "question": "Wie sieht das Formsignal vom Herzstück aus gesehen aus?", "answer": "Bei einfachen Weichen und Innenbogenweichen: runde weiße Scheibe auf schwarzem Grund. Bei Außenbogenweichen: nach links oder rechts geöffnete Sichel auf runder weißer Scheibe.", "sig": ["wnHz", "wnHzS"], "group": "Wn"}, {"difficulty": "schwer", "question": "Wann ist die Sichel (Außenbogenweiche, vom Herzstück aus) nach links, wann nach rechts geöffnet?", "answer": "Bei Fahrten aus dem linksseitigen Gleis nach links, bei Fahrten aus dem rechtsseitigen Gleis nach rechts.", "sig": ["wnHzS", "wnHzSr"], "group": "Wn"}, {"difficulty": "schwer", "question": "Was bedeuten „links“ und „rechts“ in der Signalbedeutung der Signale für doppelte Kreuzungsweichen?", "answer": "Die Weiche steht für die Fahrt in den oder aus dem entsprechenden Zweig.", "group": "Wn"}, {"difficulty": "schwer", "question": "Wie zeigen Signale bei doppelten Kreuzungsweichen den Fahrweg?", "answer": "Die Richtung der Pfeile oder Streifen kennzeichnet den Fahrweg: der untere Pfeil/Streifen gibt die Fahrt in die Weiche an, der obere die Fahrt aus der Weiche.", "sig": ["wn3f", "wn4f"], "group": "Wn"}, {"difficulty": "schwer", "question": "Wird durch Wn 7 die Zustimmung des Weichenwärters erteilt?", "answer": "Nein, durch Wn 7 wird keine Zustimmung des Weichenwärters erteilt.", "sig": ["wn7"], "group": "Wn"}, {"difficulty": "schwer", "question": "Was zeigt Wn 7 nach rückwärts bei Tage?", "answer": "Eine kleine weiße, runde Scheibe auf schwarzem Grund.", "sig": ["wn7"], "group": "Wn"}, {"difficulty": "schwer", "question": "Welches Signal darf bis auf weiteres anstelle von Wn 7 verwendet werden?", "answer": "Das Signal Sh 1 (Formsignal).", "sig": ["wn7"], "group": "Wn"}, {"difficulty": "leicht", "question": "Ra 10 (Rangierhalttafel) – Was bedeutet das Signal?", "answer": "Über die Tafel hinaus darf nicht rangiert werden.", "sig": ["ra10", "ra10b"], "look": "Eine oben halbkreisförmig abgerundete weiße Tafel mit schwarzer Aufschrift „Halt für Rangierfahrten“. Die weiße Tafel kann auch ohne Aufschrift sein.", "group": "Ra"}, {"difficulty": "leicht", "question": "Ra 11 / Ra 11a / Ra 11b (Wartezeichen) – Was bedeutet das Signal?", "answer": "Auftrag des Wärters zur Rangierfahrt abwarten.", "sig": ["ra11", "ra11b"], "look": "Ra 11 (DS 301) und Ra 11a (DV 301): ein gelbes W mit schwarzem Rand.\nRa 11b (DV 301): ein weißes W mit schwarzem Rand.", "group": "Ra"}, {"difficulty": "leicht", "question": "Ra 12 / So 12 (Grenzzeichen) – Was bedeutet das Signal?", "answer": "Grenze, bis zu der bei zusammenlaufenden Gleisen das Gleis besetzt werden darf.", "sig": ["ra12"], "look": "Ein rot-weißes Zeichen.", "group": "Ra"}, {"difficulty": "leicht", "question": "Ra 13 (Isolierzeichen) – Was bedeutet das Signal?", "answer": "Kennzeichnung der Grenze der Gleisisolierung.", "sig": ["ra13"], "look": "Auf weißem Grund ein blauer Pfeil.", "group": "Ra"}, {"difficulty": "mittel", "question": "Wie sieht Ra 10 aus?", "answer": "Oben halbkreisförmig abgerundete weiße Tafel mit schwarzer Aufschrift „Halt für Rangierfahrten“ (kann auch ohne Aufschrift sein).", "sig": ["ra10", "ra10b"], "group": "Ra"}, {"difficulty": "mittel", "question": "Wie sieht Ra 11 aus, und wie Ra 11b?", "answer": "Ra 11 / Ra 11a: gelbes W mit schwarzem Rand. Ra 11b: weißes W mit schwarzem Rand.", "sig": ["ra11", "ra11b"], "group": "Ra"}, {"difficulty": "mittel", "question": "Wie sieht Ra 12 / So 12 aus?", "answer": "Ein rot-weißes Zeichen.", "sig": ["ra12"], "group": "Ra"}, {"difficulty": "mittel", "question": "Wie sieht Ra 13 aus?", "answer": "Auf weißem Grund ein blauer Pfeil.", "sig": ["ra13"], "group": "Ra"}, {"difficulty": "schwer", "question": "Wo steht Ra 10?", "answer": "Das Signal steht in der Regel links vom Gleis.", "sig": ["ra10"], "group": "Ra"}, {"difficulty": "schwer", "question": "Wo steht Ra 12 (So 12)?", "answer": "Im Winkel zwischen beiden Gleisen: entweder ein Zeichen in der Mitte zwischen beiden Gleisen oder je ein Zeichen neben der inneren Schiene jedes Gleises.", "sig": ["ra12"], "group": "Ra"}, {"difficulty": "schwer", "question": "Was gibt das Isolierzeichen (Ra 13) an?", "answer": "Wie weit ein Gleis freizuhalten ist, damit das Umstellen von Weichen und Signalen nicht verhindert wird.", "sig": ["ra13"], "group": "Ra"}, {"difficulty": "schwer", "question": "Wo steht Ra 13, und worauf weist der Pfeil?", "answer": "Rechts oder links vom Gleis. Der blaue Pfeil weist auf das zugehörige Gleis. Das Signal kann auch vor Zugeinwirkungsstellen von Automatik-Hilfseinschalttasten der BÜ angeordnet sein.", "sig": ["ra13"], "group": "Ra"}, {"difficulty": "schwer", "question": "Wer muss vor der Vorbeifahrt am Wartezeichen (Ra 11) zugestimmt haben?", "answer": "Bevor mit der Spitze einer Rangierfahrt am Wartezeichen vorbeigefahren werden darf, muss der Weichenwärter eine Zustimmung gegeben haben.", "sig": ["ra11"], "group": "Ra"}, {"difficulty": "schwer", "question": "Wie wird die Zustimmung zur Vorbeifahrt an Ra 11, Ra 11a und Ra 11b gegeben?", "answer": "a) Ra 11 (DS 301): durch Lichtsignal Sh 1 (DS 301).\nb) Ra 11 (DS 301) und Ra 11b (DV 301): mündlich oder durch Hochhalten eines Armes oder einer weiß leuchtenden Handleuchte.\nc) Ra 11a (DV 301): durch Signal Ra 12 (DV 301).", "sig": ["ra11", "ra11b"], "group": "Ra"}, {"difficulty": "schwer", "question": "Wann wird Ra 11a angewandt, wann Ra 11b?", "answer": "Ra 11a (DV 301) nur in Verbindung mit Ra 12 (DV 301). Ra 11b (DV 301) alleinstehend sowie an Drehscheiben und Schiebebühnen, stets ohne Ra 12 (DV 301).", "sig": ["ra11", "ra11b"], "group": "Ra"}, {"difficulty": "schwer", "question": "Was zeigt Ra 11b an Drehscheiben und Schiebebühnen an?", "answer": "Dass diese von Fahrzeugen erst befahren oder verlassen werden dürfen, wenn der Wärter hierfür die Zustimmung gibt.", "sig": ["ra11b"], "group": "Ra"}, {"difficulty": "schwer", "question": "Ist das Wartezeichen (Ra 11) bei Dunkelheit beleuchtet?", "answer": "Das Signal kann bei Dunkelheit beleuchtet sein.", "sig": ["ra11"], "group": "Ra"}, {"difficulty": "leicht", "question": "Zs 1 (Ersatzsignal) – Was bedeutet das Signal?", "answer": "Am Signal Hp 0 oder am gestörten Lichthauptsignal ohne schriftlichen Befehl vorbeifahren.", "sig": ["zs1", "zs1b"], "look": "Drei weiße Lichter in Form eines A\noder ein weißes Blinklicht.", "group": "Zs"}, {"difficulty": "leicht", "question": "Zs 2 (Richtungsanzeiger) – Was bedeutet das Signal?", "answer": "Die Fahrstraße führt in die angezeigte Richtung.", "sig": ["zs2"], "look": "Ein weißleuchtender Buchstabe.", "group": "Zs"}, {"difficulty": "leicht", "question": "Zs 2v (Richtungsvoranzeiger) – Was bedeutet das Signal?", "answer": "Richtungsanzeiger (Zs 2) erwarten.", "sig": ["zs2v"], "look": "Ein gelbleuchtender Buchstabe.", "group": "Zs"}, {"difficulty": "leicht", "question": "Zs 3 (Geschwindigkeitsanzeiger) – Was bedeutet das Signal?", "answer": "Die durch die Kennziffer angezeigte Geschwindigkeit darf vom Signal ab im anschließenden Weichenbereich nicht überschritten werden.", "sig": ["zs3f", "zs3fu", "zs3l"], "look": "Formsignal: eine weiße Kennziffer auf dreieckiger schwarzer Tafel mit weißem Rand. Die Tafel steht in der Regel auf der Spitze; bei beschränktem Raum kann die Spitze nach oben zeigen.\nLichtsignal: eine weiß leuchtende Kennziffer.", "group": "Zs"}, {"difficulty": "leicht", "question": "Zs 3v (Geschwindigkeitsvoranzeiger) – Was bedeutet das Signal?", "answer": "Geschwindigkeitsanzeiger (Zs 3) erwarten.", "sig": ["zs3vf", "zs3vl"], "look": "Lichtsignal: eine gelbleuchtende Kennziffer.\nFormsignal: eine gelbe Kennziffer auf dreieckiger schwarzer Tafel mit gelbem Rand.", "group": "Zs"}, {"difficulty": "leicht", "question": "Zs 6 (Gegengleisanzeiger) – Was bedeutet das Signal?", "answer": "Der Fahrweg führt in das Streckengleis entgegen der gewöhnlichen Fahrtrichtung.", "sig": ["zs6l", "zs6f"], "look": "Lichtsignal: ein weiß leuchtender schräger Lichtstreifen, dessen Enden in der Regel senkrecht nach oben und unten abgebogen sind.\nFormsignal: eine rechteckige schwarze Scheibe mit weißem Rand und einem weißen von rechts nach links steigenden Streifen, dessen Enden senkrecht abgewinkelt sind. Das Formsignal ist rückstrahlend.\nDV 301: Die Enden können bis auf weiteres nicht abgewinkelt sein.", "group": "Zs"}, {"difficulty": "leicht", "question": "Zs 7 (Vorsichtssignal) – Was bedeutet das Signal?", "answer": "Am Signal Hp 0 oder am gestörten Lichthauptsignal ohne schriftlichen Befehl vorbeifahren! Weiterfahrt auf Sicht.", "sig": ["zs7"], "look": "Drei gelbe Lichter in Form eines V.", "group": "Zs"}, {"difficulty": "leicht", "question": "Zs 8 (Gegengleisfahrt-Ersatzsignal) – Was bedeutet das Signal?", "answer": "Am Halt zeigenden oder gestörten Hauptsignal vorbeifahren, der Fahrweg führt in das Streckengleis entgegen der gewöhnlichen Fahrtrichtung.", "sig": ["zs8", "zs8b"], "look": "Drei blinkende weiße Lichter in Form eines A\noder ein weißblinkender Lichtstreifen von rechts nach links steigend.", "group": "Zs"}, {"difficulty": "leicht", "question": "Zs 10 (Endesignal, DS 301) – Was bedeutet das Signal?", "answer": "Ende der Geschwindigkeitsbeschränkung.", "sig": ["zs10f", "zs10l"], "look": "Formsignal: ein weißer Pfeil mit der Spitze nach oben auf pfeilförmiger, schwarzer Tafel.\nLichtsignal: ein weißleuchtender Pfeil mit der Spitze nach oben.", "group": "Zs"}, {"difficulty": "leicht", "question": "Zs 12 (M-Tafel) – Was bedeutet das Signal?", "answer": "Am Halt zeigenden oder gestörten Hauptsignal auf mündlichen oder fernmündlichen Auftrag vorbeifahren.", "sig": ["zs12"], "look": "Eine weiße Tafel mit rotem Rand und rotem „M“ in Schreibschrift.", "group": "Zs"}, {"difficulty": "leicht", "question": "Zs 13 (Stumpfgleis- und Frühhaltanzeiger) – Was bedeutet das Signal?", "answer": "Fahrt in ein Stumpfgleis oder in ein Gleis mit verkürztem Einfahrweg.", "sig": ["zs13f", "zs13l"], "look": "Formsignal: ein um 90° nach links umgelegtes gelbes rückstrahlendes „T“ auf einer rechteckigen schwarzen Tafel.\nLichtsignal: ein um 90° nach links umgelegtes gelbleuchtendes „T“.", "group": "Zs"}, {"difficulty": "mittel", "question": "Wie sieht Zs 1 aus?", "answer": "Drei weiße Lichter in Form eines A\noder ein weißes Blinklicht.", "sig": ["zs1", "zs1b"], "group": "Zs"}, {"difficulty": "mittel", "question": "Wie sieht Zs 2 aus?", "answer": "Ein weißleuchtender Buchstabe.", "sig": ["zs2"], "group": "Zs"}, {"difficulty": "mittel", "question": "Wie sieht Zs 2v aus?", "answer": "Ein gelbleuchtender Buchstabe.", "sig": ["zs2v"], "group": "Zs"}, {"difficulty": "mittel", "question": "Wie sieht Zs 3 aus?", "answer": "Formsignal: eine weiße Kennziffer auf dreieckiger schwarzer Tafel mit weißem Rand. Die Tafel steht in der Regel auf der Spitze; bei beschränktem Raum kann die Spitze nach oben zeigen.\nLichtsignal: eine weiß leuchtende Kennziffer.", "sig": ["zs3f", "zs3fu", "zs3l"], "group": "Zs"}, {"difficulty": "mittel", "question": "Wie sieht Zs 3v aus?", "answer": "Lichtsignal: eine gelbleuchtende Kennziffer.\nFormsignal: eine gelbe Kennziffer auf dreieckiger schwarzer Tafel mit gelbem Rand.", "sig": ["zs3vf", "zs3vl"], "group": "Zs"}, {"difficulty": "mittel", "question": "Wie sieht Zs 6 aus?", "answer": "Lichtsignal: ein weiß leuchtender schräger Lichtstreifen, dessen Enden in der Regel senkrecht nach oben und unten abgebogen sind.\nFormsignal: eine rechteckige schwarze Scheibe mit weißem Rand und einem weißen von rechts nach links steigenden Streifen, dessen Enden senkrecht abgewinkelt sind. Das Formsignal ist rückstrahlend.\nDV 301: Die Enden können bis auf weiteres nicht abgewinkelt sein.", "sig": ["zs6l", "zs6f"], "group": "Zs"}, {"difficulty": "mittel", "question": "Wie sieht Zs 7 aus?", "answer": "Drei gelbe Lichter in Form eines V.", "sig": ["zs7"], "group": "Zs"}, {"difficulty": "mittel", "question": "Wie sieht Zs 8 aus?", "answer": "Drei blinkende weiße Lichter in Form eines A\noder ein weißblinkender Lichtstreifen von rechts nach links steigend.", "sig": ["zs8", "zs8b"], "group": "Zs"}, {"difficulty": "mittel", "question": "Wie sieht Zs 10 aus?", "answer": "Formsignal: ein weißer Pfeil mit der Spitze nach oben auf pfeilförmiger, schwarzer Tafel.\nLichtsignal: ein weißleuchtender Pfeil mit der Spitze nach oben.", "sig": ["zs10f", "zs10l"], "group": "Zs"}, {"difficulty": "mittel", "question": "Wie sieht Zs 12 aus?", "answer": "Eine weiße Tafel mit rotem Rand und rotem „M“ in Schreibschrift.", "sig": ["zs12"], "group": "Zs"}, {"difficulty": "mittel", "question": "Wie sieht Zs 13 aus?", "answer": "Formsignal: ein um 90° nach links umgelegtes gelbes rückstrahlendes „T“ auf einer rechteckigen schwarzen Tafel.\nLichtsignal: ein um 90° nach links umgelegtes gelbleuchtendes „T“.", "sig": ["zs13f", "zs13l"], "group": "Zs"}, {"difficulty": "schwer", "question": "Wofür gelten Zusatzsignale, und was gilt für Zs 103?", "answer": "Zusatzsignale gelten für Zugfahrten. Das Signal Zs 103 (DV 301) gilt nur für Rangierfahrten.", "group": "Zs"}, {"difficulty": "schwer", "question": "Wo werden ortsfeste Zusatzsignale in der Regel gezeigt, und welche können alleinstehend gezeigt werden?", "answer": "Ortsfeste Zusatzsignale werden in der Regel an Haupt- oder Vorsignalen gezeigt. Die Signale Zs 2, Zs 2v, Zs 3, Zs 3v, Zs 6 und Zs 10 (DS 301) können alleinstehend gezeigt werden.", "group": "Zs"}, {"difficulty": "schwer", "question": "Gilt das Ersatzsignal Zs 1 auch, wenn es erlischt?", "answer": "Ja, das Ersatzsignal gilt auch, wenn es erlischt, bevor die Spitze des Zuges am Signal vorbeigefahren ist.", "sig": ["zs1"], "group": "Zs"}, {"difficulty": "schwer", "question": "Wofür gibt der Richtungsanzeiger (Zs 2) einen Kennbuchstaben an?", "answer": "Für welche Fahrtrichtung oder für welches Streckengleis mehrerer nebeneinander verlaufender Strecken das Hauptsignal auf Fahrt steht. Er wird auch angewandt, wenn dem Triebfahrzeugführer bei größeren Bahnhöfen die Einfahrt in einen bestimmten Bahnhofsteil (z. B. Rangier- oder Personenbahnhof) angezeigt werden soll.", "sig": ["zs2"], "group": "Zs"}, {"difficulty": "schwer", "question": "Wo sind die verwendeten Buchstaben des Zs 2 enthalten?", "answer": "Der Infrastrukturunternehmer gibt die verwendeten Kennbuchstaben bekannt. Sie sind im Fahrplan enthalten; außerdem können sie in örtlichen Zusätzen enthalten sein.", "sig": ["zs2"], "group": "Zs"}, {"difficulty": "schwer", "question": "Welche Besonderheit gilt für den Richtungsvoranzeiger (Zs 2v) im Geltungsbereich der DV 301?", "answer": "Im Geltungsbereich der DV 301 darf der Richtungsvoranzeiger bis auf weiteres auch weißleuchtend sein.", "sig": ["zs2v"], "group": "Zs"}, {"difficulty": "schwer", "question": "Was bedeutet die gezeigte Kennziffer bei Zs 3 und Zs 3v?", "answer": "Der 10fache Wert der Kennziffer in km/h ist als Fahrgeschwindigkeit zugelassen (z. B. 6 = 60 km/h).", "sig": ["zs3f", "zs3vf"], "group": "Zs"}, {"difficulty": "schwer", "question": "Wann wird Zs 3 auch an Blocksignalen selbsttätiger Blockstellen (Sbk) angewendet?", "answer": "Wenn das nächste Signal im verkürzten Bremswegabstand folgt. In diesem Fall gilt die angezeigte Geschwindigkeit bei Vorbeifahrt der Spitze des Zuges am Signal.", "sig": ["zs3l"], "group": "Zs"}, {"difficulty": "schwer", "question": "Was können die Kennziffern 3, 1 und 2 bei Zs 3 anzeigen?", "answer": "Die Kennziffer 3 kann anzeigen, dass in Stumpfgleise eingefahren wird oder dass ein ausreichender Durchrutschweg fehlt. Die Kennziffern 1 und 2 können anzeigen, dass besonders früh zu halten oder in ein besetztes Gleis einzufahren ist.", "sig": ["zs3l"], "group": "Zs"}, {"difficulty": "schwer", "question": "Was gilt, wenn innerhalb des anschließenden Weichenbereichs durch ein Signal Zs 3 eine andere Geschwindigkeit angezeigt wird?", "answer": "Diese Geschwindigkeit gilt bis zum Ende des Weichenbereichs. Eine durch Hauptsignal oder Signal Zs 3 vorgeschriebene Geschwindigkeitsbeschränkung kann durch ein alleinstehendes Signal Zs 3 bereits vor dem Ende des anschließenden Weichenbereichs geändert werden.", "sig": ["zs3f"], "group": "Zs"}, {"difficulty": "schwer", "question": "Wie ist das Formsignal Zs 3 zu erkennen, und wie steht es an Lichthauptsignalen?", "answer": "Das Formsignal ist rückstrahlend oder bei Dunkelheit beleuchtet; es kann bis auf weiteres nicht rückstrahlend oder beleuchtet sein. Das Formsignal an Lichthauptsignalen zeigt mit der Spitze nach oben.", "sig": ["zs3fu"], "group": "Zs"}, {"difficulty": "schwer", "question": "Ist das Formsignal Zs 3v rückstrahlend?", "answer": "Ja, das Formsignal ist rückstrahlend.", "sig": ["zs3vf"], "group": "Zs"}, {"difficulty": "schwer", "question": "Was zeigt der Gegengleisanzeiger (Zs 6) an, und bis wohin gilt der Auftrag?", "answer": "Dass auf zweigleisiger Strecke das Gleis entgegen der gewöhnlichen Fahrtrichtung befahren werden darf. Der Auftrag gilt bis zum nächsten Bahnhof; liegt davor eine Abzweig- oder Überleitstelle, gilt er bis dahin.", "sig": ["zs6l"], "group": "Zs"}, {"difficulty": "schwer", "question": "Wie wird die vorübergehende Anwendung des Formsignals Zs 6 bekannt gegeben?", "answer": "Bei den Eisenbahnen des Bundes durch das Infrastrukturunternehmen in der La. Bei NE-Bahnen wird in einer betrieblichen Anweisung des Betriebsleiters darauf hingewiesen.", "sig": ["zs6f"], "group": "Zs"}, {"difficulty": "schwer", "question": "Wie lange gilt der Auftrag „Weiterfahrt auf Sicht“ bei Zs 7?", "answer": "Bis zum nächsten Hauptsignal. Das Signal gilt weiter, auch wenn es erlischt, bevor die Spitze des Zuges daran vorbeigefahren ist.", "sig": ["zs7"], "group": "Zs"}, {"difficulty": "schwer", "question": "Was gilt für das Verhalten nach der Vorbeifahrt an Zs 7 bei den Gleichstrom-S-Bahnen Berlin und Hamburg?", "answer": "Es sind die örtlichen Zusätze zu beachten.", "sig": ["zs7"], "group": "Zs"}, {"difficulty": "schwer", "question": "Wofür gilt das Signal Zs 10, und was zeigt es an?", "answer": "Es gilt nur für Zugfahrten, die durch Fahrtstellung eines Hauptsignals zugelassen worden sind. Es zeigt an, dass eine mit Signal Hp 2 oder mit Signal Zs 3 vorgeschriebene Geschwindigkeitsbeschränkung bereits vor dem Ende des anschließenden Weichenbereichs aufgehoben ist.", "sig": ["zs10f"], "group": "Zs"}, {"difficulty": "schwer", "question": "Ist das Formsignal Zs 10 rückstrahlend, und können mehrere Zs 10 aufgestellt sein?", "answer": "Das Formsignal ist rückstrahlend. Innerhalb eines anschließenden Weichenbereichs können mehrere Signale Zs 10 für verschiedene Fahrwege aufgestellt sein.", "sig": ["zs10f"], "group": "Zs"}, {"difficulty": "schwer", "question": "Wann dürfen Züge am Halt zeigenden oder gestörten Hauptsignal vorbeifahren (Zs 12)?", "answer": "Nach dem Halten auf mündlichen oder fernmündlichen Auftrag des Fahrdienstleiters. Der Fahrdienstleiter darf zur Übermittlung seines Auftrags eine örtliche Aufsicht beauftragen.", "sig": ["zs12"], "group": "Zs"}, {"difficulty": "leicht", "group": "Sh", "question": "Sh 0 – Was bedeutet das Signal?", "answer": "Halt! Fahrverbot.", "sig": ["sh0", "sh0b"], "look": "Ein waagerechter schwarzer Streifen in runder weißer Scheibe auf schwarzem Grund."}, {"difficulty": "leicht", "group": "Sh", "question": "Sh 1 / Ra 12 (Rangierfahrtsignal, DV 301) – Was bedeutet das Signal?", "answer": "Sh 1: Fahrverbot aufgehoben. Ra 12 (DV 301): Rangierfahrt erlaubt.", "sig": ["sh1f", "sh1l"], "look": "Formsignal Sh 1: ein nach rechts steigender schwarzer Streifen auf runder weißer Scheibe.\nLichtsignal Sh 1 (DS 301) / Ra 12 (DV 301): zwei weiße Lichter nach rechts steigend."}, {"difficulty": "leicht", "group": "Sh", "question": "Sh 2 – Was bedeutet das Signal?", "answer": "Schutzhalt.", "sig": ["sh2", "sh2n"], "look": "Tageszeichen: eine rechteckige rote Scheibe mit weißem Rand.\nNachtzeichen: ein rotes Licht am Tageszeichen oder am Ausleger des Wasserkrans."}, {"difficulty": "leicht", "group": "Sh", "question": "Sh 3 (Kreissignal) – Was bedeutet das Signal?", "answer": "Sofort halten.", "sig": ["sh3", "sh3n"], "look": "Tageszeichen: eine rot-weiße Signalfahne, irgendein Gegenstand oder der Arm wird im Kreis geschwungen.\nNachtzeichen: eine Laterne, möglichst rot abgeblendet, oder ein leuchtender Gegenstand wird im Kreis geschwungen."}, {"difficulty": "leicht", "group": "Sh", "question": "Sh 5 (Horn- und Pfeifsignal) – Was bedeutet das Signal?", "answer": "Sofort halten.", "sig": ["sh5"], "look": "Mehrmals nacheinander drei kurze Töne."}, {"difficulty": "mittel", "group": "Sh", "question": "Wie sieht Sh 0 aus?", "answer": "Ein waagerechter schwarzer Streifen in runder weißer Scheibe auf schwarzem Grund.", "sig": ["sh0", "sh0b"]}, {"difficulty": "mittel", "group": "Sh", "question": "Wie sieht Sh 1 / Ra 12 aus?", "answer": "Formsignal Sh 1: ein nach rechts steigender schwarzer Streifen auf runder weißer Scheibe.\nLichtsignal Sh 1 (DS 301) / Ra 12 (DV 301): zwei weiße Lichter nach rechts steigend.", "sig": ["sh1f", "sh1l"]}, {"difficulty": "mittel", "group": "Sh", "question": "Wie sieht Sh 2 aus?", "answer": "Tageszeichen: eine rechteckige rote Scheibe mit weißem Rand.\nNachtzeichen: ein rotes Licht am Tageszeichen oder am Ausleger des Wasserkrans.", "sig": ["sh2", "sh2n"]}, {"difficulty": "mittel", "group": "Sh", "question": "Wie sieht Sh 3 aus?", "answer": "Tageszeichen: eine rot-weiße Signalfahne, irgendein Gegenstand oder der Arm wird im Kreis geschwungen.\nNachtzeichen: eine Laterne, möglichst rot abgeblendet, oder ein leuchtender Gegenstand wird im Kreis geschwungen.", "sig": ["sh3", "sh3n"]}, {"difficulty": "mittel", "group": "Sh", "question": "Wie ist Sh 5 zu hören?", "answer": "Mehrmals nacheinander drei kurze Töne.", "sig": ["sh5"]}, {"difficulty": "schwer", "group": "Sh", "question": "Wozu dienen Schutzsignale (Sh), und für wen gelten sie?", "answer": "Sie dienen dazu, ein Gleis abzuriegeln, den Auftrag zum Halten zu erteilen oder die Aufhebung eines Fahrverbots anzuzeigen. Sie gelten für Zug- und Rangierfahrten."}, {"difficulty": "schwer", "group": "Sh", "question": "Wo werden die Signale Sh 0 und Sh 1 verwendet?", "answer": "Am Sperrsignal, Gleissperrensignal (Formsignal) und Abschlusssignal von Stumpfgleisen.", "sig": ["sh0", "sh1f"]}, {"difficulty": "schwer", "group": "Sh", "question": "Womit kann das Formsignal verbunden sein?", "answer": "Das Formsignal kann mit einem Wartezeichen (Signal Ra 11) verbunden sein.", "sig": ["sh1f"]}, {"difficulty": "schwer", "group": "Sh", "question": "Wo dürfen die Schutzsignale abweichend links aufgestellt sein?", "answer": "Bei Gleiswaagen, Schiebebühnen und Drehscheiben (abweichend von Richtlinie 301.0002 Abschnitt 2 Absatz 3)."}, {"difficulty": "schwer", "group": "Sh", "question": "Wann sind Sh 0 und Formsignale Sh 1 bei Dunkelheit beleuchtet?", "answer": "Sh 0 an Gleisabschlüssen, die Stumpfgleiseinfahrten begrenzen, sind bei Dunkelheit beleuchtet. Übrige Sh 0 und Formsignale Sh 1 sind rückstrahlend oder beleuchtet, wenn der Betrieb es erfordert.", "sig": ["sh0"]}, {"difficulty": "schwer", "group": "Sh", "question": "Was zeigt Sh 0 bei Gleiswaagen, Drehscheiben und am Gleissperrensignal an?", "answer": "Bei Gleiswaagen und Drehscheiben, dass sie nicht befahren werden dürfen.
