Das Gleissperrensignal zeigt an, dass die Gleissperre aufgelegt ist.", "sig": ["sh0"]}, {"difficulty": "schwer", "group": "Sh", "question": "Was zeigt Sh 0 von hinten?", "answer": "Wo der Eisenbahninfrastrukturunternehmer bestimmt, dass die Stellung auch von hinten erkennbar sein soll: bei Tage zwei weiße runde Scheiben auf schwarzem Grund waagerecht nebeneinander; bei Dunkelheit rückstrahlend oder beleuchtet.", "sig": ["sh0b"]}, {"difficulty": "schwer", "group": "Sh", "question": "Was zeigt Sh 1 in Verbindung mit Hp 0 an?", "answer": "Dass das Haltegebot für Rangierfahrten aufgehoben ist.", "sig": ["sh1f"]}, {"difficulty": "schwer", "group": "Sh", "question": "Wird durch Sh 1 am Gleissperrensignal die Zustimmung des Weichenwärters erteilt?", "answer": "Nein. Das Signal Sh 1 am Gleissperrensignal zeigt nur an, dass die Gleissperre abgelegt ist.", "sig": ["sh1f"]}, {"difficulty": "schwer", "group": "Sh", "question": "Für welche Rangierfahrt gilt die Zustimmung, wenn mehrere vor dem Signal halten oder sich ihm nähern?", "answer": "Nur für die erste Rangierfahrt.", "sig": ["sh1l"]}, {"difficulty": "schwer", "group": "Sh", "question": "Was ist zu tun, wenn Sh 1 (Lichtsignal) bzw. Ra 12 erlischt, bevor die Spitze der Rangierfahrt vorbeigefahren ist?", "answer": "Das erneute Aufleuchten des Signals ist abzuwarten.", "sig": ["sh1l"]}, {"difficulty": "schwer", "group": "Sh", "question": "Was gilt, wenn das Formsignal Sh 1 mit einem Wartezeichen verbunden ist?", "answer": "Es ist stets eine besondere Zustimmung des Weichenwärters zur Vorbeifahrt abzuwarten.", "sig": ["sh1f"]}, {"difficulty": "schwer", "group": "Sh", "question": "Was zeigt das Formsignal Sh 1 von hinten?", "answer": "Wo der Eisenbahninfrastrukturunternehmer bestimmt, dass es auch von hinten erkennbar sein soll: bei Tage eine weiße runde Scheibe auf schwarzem Grund; bei Dunkelheit rückstrahlend oder beleuchtet.", "sig": ["sh1b"]}, {"difficulty": "schwer", "group": "Sh", "question": "Als was wird Sh 2 verwendet?", "answer": "Als Wärterhaltscheibe und als Abschlusssignal eines Stumpfgleises.", "sig": ["sh2"]}, {"difficulty": "schwer", "group": "Sh", "question": "Wo wird die Wärterhaltscheibe aufgestellt?", "answer": "Sie ist nicht ortsfest. Ist die Regelaufstellung nicht möglich, ist sie im Gleis aufgestellt. Auf freier Strecke in mindestens 50 m Sicherheitsabstand vor der zu schützenden Stelle.", "sig": ["sh2"]}, {"difficulty": "schwer", "group": "Sh", "question": "Wofür wird die Wärterhaltscheibe verwendet?", "answer": "a) zur Kennzeichnung einer Gleisstelle, die vorübergehend nicht befahren werden darf, b) zur Kennzeichnung einer Stelle, an der Züge ausnahmsweise anhalten sollen.", "sig": ["sh2"]}, {"difficulty": "schwer", "group": "Sh", "question": "Wo steht die Wärterhaltscheibe bei Abriegelung eines Gleises im Tunnel?", "answer": "Außerhalb des Tunnels. Ausnahmen für lange Tunnel ordnet bei den Eisenbahnen des Bundes der Eisenbahninfrastrukturunternehmer an, bei den NE der Betriebsleiter.", "sig": ["sh2"]}, {"difficulty": "schwer", "group": "Sh", "question": "Wie wird der Haltauftrag der Wärterhaltscheibe aufgehoben?", "answer": "Durch Entfernen oder Wegdrehen bzw. Wegklappen des Signals, soweit der Auftrag zur Vorbeifahrt nicht durch Befehl erteilt wird.", "sig": ["sh2"]}, {"difficulty": "schwer", "group": "Sh", "question": "Was wird am Abschlusssignal des Einfahrstumpfgleises bei ausreichender Außenbeleuchtung gezeigt?", "answer": "Bei ausreichender Außenbeleuchtung oder bei einfachen Verhältnissen nur das Tageszeichen. Das Abschlusssignal übriger Stumpfgleise ist rückstrahlend oder beleuchtet, wenn der Betrieb es erfordert.", "sig": ["sh2"]}, {"difficulty": "schwer", "group": "Sh", "question": "Wann wird das Kreissignal (Sh 3) gegeben?", "answer": "Wenn ein Zug oder eine Rangierfahrt sofort zum Halten gebracht werden muss. Ist es zweifelhaft, ob das Signal wahrgenommen wird, ist auch das Horn- und Pfeifsignal (Sh 5) anzuwenden.", "sig": ["sh3"]}, {"difficulty": "schwer", "group": "Sh", "question": "Wann wird das Horn- und Pfeifsignal (Sh 5) gegeben?", "answer": "a) wenn das Kreissignal (Sh 3) nicht gegeben werden kann oder nicht ausreichend erscheint, b) um andere Mitarbeiter zum Anhalten eines Zuges oder einer Rangierfahrt zu veranlassen.", "sig": ["sh5"]}, {"difficulty": "leicht", "group": "Ne", "question": "Ne 1 (Trapeztafel) – Was bedeutet das Signal?", "answer": "Kennzeichnung der Stelle, wo bestimmte Züge vor einer Betriebsstelle zu halten haben.", "sig": ["ne1", "ne1km"], "look": "Eine weiße Trapeztafel mit schwarzem Rand an schwarz und weiß schräg gestreiftem Pfahl."}, {"difficulty": "leicht", "group": "Ne", "question": "Ne 2 (Vorsignaltafel) – Was bedeutet das Signal?", "answer": "Kennzeichnung des Standorts eines Vorsignals.", "sig": ["ne2", "ne2_dv"], "look": "Eine schwarzgeränderte weiße Tafel mit zwei übereinander stehenden schwarzen Winkeln, die sich mit der Spitze berühren.\nDV 301, dreibegriffiges Formvorsignal: über der Vorsignaltafel kann eine dreieckige, schwarzgeränderte, weiße Tafel mit einem schwarzen Punkt angebracht sein."}, {"difficulty": "leicht", "group": "Ne", "question": "Ne 3 (Vorsignalbaken) – Was bedeutet das Signal?", "answer": "Ein Vorsignal ist zu erwarten.", "sig": ["ne3"], "look": "Mehrere aufeinanderfolgende viereckige weiße Tafeln mit einem oder mehreren nach rechts steigenden schwarzen Streifen, deren Anzahl in der Fahrtrichtung abnimmt.\nBei Dunkelheit und unsichtigem Wetter können zusätzlich rückstrahlende weiße Streifen erscheinen."}, {"difficulty": "leicht", "group": "Ne", "question": "Ne 4 (Schachbretttafel) – Was bedeutet das Signal?", "answer": "Das Hauptsignal steht – abweichend von der Regel – an einem anderen Standort.", "sig": ["ne4"], "look": "Eine viereckige, schachbrettartig schwarz und weiß gemusterte Tafel."}, {"difficulty": "leicht", "group": "Ne", "question": "Ne 5 (Haltetafel) – Was bedeutet das Signal?", "answer": "Kennzeichnung des Halteplatzes der Zugspitze bei planmäßig haltenden Zügen.", "sig": ["ne5", "ne5b"], "look": "Eine hochstehende weiße Rechteckscheibe mit schwarzem Rand und schwarzem H\noder eine hochstehende schwarze Rechteckscheibe mit weißem H."}, {"difficulty": "leicht", "group": "Ne", "question": "Ne 6 (Haltepunkttafel) – Was bedeutet das Signal?", "answer": "Ein Haltepunkt ist zu erwarten.", "sig": ["ne6"], "look": "Eine schräg zum Gleis gestellte waagerechte weiße Tafel mit drei schwarzen Schrägstreifen."}, {"difficulty": "leicht", "group": "Ne", "question": "Ne 7 a (Schneepflugtafel) – Was bedeutet das Signal?", "answer": "Pflugschar heben.", "sig": ["ne7aw", "ne7ay"], "look": "Eine weiße Pfeilspitze mit schwarzem Rand zeigt nach oben\noder eine gelbe Pfeilspitze mit schwarzem Rand zeigt nach oben."}, {"difficulty": "leicht", "group": "Ne", "question": "Ne 7 b (Schneepflugtafel) – Was bedeutet das Signal?", "answer": "Pflugschar senken.", "sig": ["ne7bw", "ne7by"], "look": "Eine weiße Pfeilspitze mit schwarzem Rand zeigt nach unten\noder eine gelbe Pfeilspitze mit schwarzem Rand zeigt nach unten."}, {"difficulty": "leicht", "group": "Ne", "question": "Ne 12 (Ankündigungsbake) – Was bedeutet das Signal?", "answer": "Überwachungssignal einer Rückfallweiche beachten.", "sig": ["ne12"], "look": "Eine rechteckige, orangefarbene Tafel mit zwei waagerechten weißen Streifen."}, {"difficulty": "leicht", "group": "Ne", "question": "Ne 13a – Was bedeutet das Signal?", "answer": "Die Rückfallweiche ist gegen die Spitze befahrbar.", "sig": ["ne13a"], "look": "Ein weißes Licht über einem orangefarbenen waagerechten Streifen und einem orange-weiß schräg gestreiften Mastschild."}, {"difficulty": "leicht", "group": "Ne", "question": "Ne 13b – Was bedeutet das Signal?", "answer": "Die Rückfallweiche ist gegen die Spitze nicht befahrbar, vor der Weiche halten.", "sig": ["ne13b"], "look": "Ein orangefarbener waagerechter Streifen über einem orange-weiß schräg gestreiften Mastschild."}, {"difficulty": "leicht", "group": "Ne", "question": "Ne 14 (ETCS-Halt-Tafel, ETCS Stop marker) – Was bedeutet das Signal?", "answer": "Halt für Züge in ETCS-Betriebsart SR.", "sig": ["ne14", "ne14id"], "look": "Ein gelber Pfeil mit weißem Rand auf einer blauen quadratischen Tafel."}, {"difficulty": "mittel", "group": "Ne", "question": "Wie sieht Ne 1 aus?", "answer": "Eine weiße Trapeztafel mit schwarzem Rand an schwarz und weiß schräg gestreiftem Pfahl.", "sig": ["ne1", "ne1km"]}, {"difficulty": "mittel", "group": "Ne", "question": "Wie sieht Ne 2 aus?", "answer": "Eine schwarzgeränderte weiße Tafel mit zwei übereinander stehenden schwarzen Winkeln, die sich mit der Spitze berühren.\nDV 301, dreibegriffiges Formvorsignal: über der Vorsignaltafel kann eine dreieckige, schwarzgeränderte, weiße Tafel mit einem schwarzen Punkt angebracht sein.", "sig": ["ne2", "ne2_dv"]}, {"difficulty": "mittel", "group": "Ne", "question": "Wie sieht Ne 3 aus?", "answer": "Mehrere aufeinanderfolgende viereckige weiße Tafeln mit einem oder mehreren nach rechts steigenden schwarzen Streifen, deren Anzahl in der Fahrtrichtung abnimmt.\nBei Dunkelheit und unsichtigem Wetter können zusätzlich rückstrahlende weiße Streifen erscheinen.", "sig": ["ne3"]}, {"difficulty": "mittel", "group": "Ne", "question": "Wie sieht Ne 4 aus?", "answer": "Eine viereckige, schachbrettartig schwarz und weiß gemusterte Tafel.", "sig": ["ne4"]}, {"difficulty": "mittel", "group": "Ne", "question": "Wie sieht Ne 5 aus?", "answer": "Eine hochstehende weiße Rechteckscheibe mit schwarzem Rand und schwarzem H\noder eine hochstehende schwarze Rechteckscheibe mit weißem H.", "sig": ["ne5", "ne5b"]}, {"difficulty": "mittel", "group": "Ne", "question": "Wie sieht Ne 6 aus?", "answer": "Eine schräg zum Gleis gestellte waagerechte weiße Tafel mit drei schwarzen Schrägstreifen.", "sig": ["ne6"]}, {"difficulty": "mittel", "group": "Ne", "question": "Wie sieht Ne 7 a aus?", "answer": "Eine weiße Pfeilspitze mit schwarzem Rand zeigt nach oben\noder eine gelbe Pfeilspitze mit schwarzem Rand zeigt nach oben.", "sig": ["ne7aw", "ne7ay"]}, {"difficulty": "mittel", "group": "Ne", "question": "Wie sieht Ne 7 b aus?", "answer": "Eine weiße Pfeilspitze mit schwarzem Rand zeigt nach unten\noder eine gelbe Pfeilspitze mit schwarzem Rand zeigt nach unten.", "sig": ["ne7bw", "ne7by"]}, {"difficulty": "mittel", "group": "Ne", "question": "Wie sieht Ne 12 aus?", "answer": "Eine rechteckige, orangefarbene Tafel mit zwei waagerechten weißen Streifen.", "sig": ["ne12"]}, {"difficulty": "mittel", "group": "Ne", "question": "Wie sieht Ne 13a aus?", "answer": "Ein weißes Licht über einem orangefarbenen waagerechten Streifen und einem orange-weiß schräg gestreiften Mastschild.", "sig": ["ne13a"]}, {"difficulty": "mittel", "group": "Ne", "question": "Wie sieht Ne 13b aus?", "answer": "Ein orangefarbener waagerechter Streifen über einem orange-weiß schräg gestreiften Mastschild.", "sig": ["ne13b"]}, {"difficulty": "mittel", "group": "Ne", "question": "Wie sieht Ne 14 aus?", "answer": "Ein gelber Pfeil mit weißem Rand auf einer blauen quadratischen Tafel.", "sig": ["ne14", "ne14id"]}, {"difficulty": "schwer", "group": "Ne", "question": "Wo steht Ne 1 (Trapeztafel) bei den Eisenbahnen des Bundes?", "answer": "Vor Bahnhöfen ohne Einfahrsignale. Auf Strecken mit Zugleitbetrieb kann sie auch vor anderen Zuglaufstellen stehen. Bei den NE bestimmt der Betriebsleiter, wo die Trapeztafel aufgestellt ist.", "sig": ["ne1"]}, {"difficulty": "schwer", "group": "Ne", "question": "Wann kann Ne 1 an Gleisen entgegen der gewöhnlichen Fahrtrichtung aufgestellt sein?", "answer": "Wenn dort kein gültiges Haupt- oder Sperrsignal vorhanden ist. Sie ist dann mit einer Kilometerangabe ergänzt.", "sig": ["ne1km"]}, {"difficulty": "schwer", "group": "Ne", "question": "Wann ist Ne 1 rückstrahlend oder beleuchtet?", "answer": "Bei den Eisenbahnen des Bundes bestimmt der Eisenbahninfrastrukturunternehmer – bei den NE der Betriebsleiter –, wo bei ungünstigen Sichtverhältnissen das Signal rückstrahlend oder bei Dunkelheit beleuchtet ist.", "sig": ["ne1"]}, {"difficulty": "schwer", "group": "Ne", "question": "Wo steht die Vorsignaltafel (Ne 2) in der Regel, und wo ist sie nicht aufgestellt?", "answer": "In der Regel unmittelbar vor einem Vorsignal. Nicht aufgestellt ist sie vor einem Lichtvorsignal an einem Lichthauptsignal, vor einem Lichthauptsignal mit Vorsignalfunktion und vor einem Vorsignalwiederholer.", "sig": ["ne2"]}, {"difficulty": "schwer", "group": "Ne", "question": "Wo befindet sich die Vorsignaltafel bei einem über dem Gleis angebrachten Vorsignal?", "answer": "Über oder unter dem Signal.", "sig": ["ne2"]}, {"difficulty": "schwer", "group": "Ne", "question": "Wann kann die Vorsignaltafel (Ne 2) auch allein stehen?", "answer": "a) anstelle eines Vorsignals zur Kennzeichnung des Bremswegabstandes der Strecke vor einem Hauptsignal, einem Lichtsperrsignal oder einer Trapeztafel; b) als Hinweis auf ein Vorsignal, das sich abweichend an einem anderen Standort befindet, wenn Bauzustände dies erfordern (in der La oder bei NE-Bahnen in einer betrieblichen Anweisung bekannt gegeben); c) als Hinweis auf ein Blockvor- oder Einfahrvorsignal, das zwischen dem Ende des anschließenden Weichenbereichs und dem Einfahrsignal aus der Gegenrichtung unmittelbar links vom Gleis steht.", "sig": ["ne2"]}, {"difficulty": "schwer", "group": "Ne", "question": "Worauf weist ein unmittelbar rechts vom Gleis stehendes Ne 2 bei abweichendem Standort hin?", "answer": "Auf ein Vorsignal, das unmittelbar links, in einem größeren Abstand rechts oder ein Gleis weiter rechts vom befahrenen Gleis steht.", "sig": ["ne2"]}, {"difficulty": "schwer", "group": "Ne", "question": "Worauf weist ein unmittelbar links vom Gleis stehendes Ne 2 bei abweichendem Standort hin?", "answer": "Auf ein Vorsignal, das entweder rechts oder ein Gleis weiter rechts vom befahrenen Gleis steht.", "sig": ["ne2"]}, {"difficulty": "schwer", "group": "Ne", "question": "Wann wird Ne 2 nicht für Vorsignale am Standort von Hauptsignalen aufgestellt?", "answer": "Wenn für das Hauptsignal ein Signal Ne 4 aufgestellt ist.", "sig": ["ne2"]}, {"difficulty": "schwer", "group": "Ne", "question": "Wann ist Ne 2 bei Bauzuständen rückstrahlend oder beleuchtet?", "answer": "Bei Bauzuständen und wenn der Betrieb es erfordert.", "sig": ["ne2"]}, {"difficulty": "schwer", "group": "Ne", "question": "Wie ist die Vorsignaltafel bei verkürztem Vorsignalabstand gekennzeichnet?", "answer": "Ist der Abstand des Vorsignals (oder der nach Absatz 6b aufgestellten Vorsignaltafel) vom zugehörigen Signal um mehr als 5 % kürzer als der Bremsweg der Strecke, trägt die Vorsignaltafel auf dem oberen Rand ein auf der Spitze stehendes weißes Dreieck mit schwarzem Rand. Bei beschränktem Raum kann es vor der Vorsignaltafel stehen. Die Kennzeichnung entfällt bei Vorsignalen mit weißem Zusatzlicht oder nach den Absätzen 10 und 11.", "sig": ["ne2_kurz"]}, {"difficulty": "schwer", "group": "Ne", "question": "Wie können Lichtvorsignale im Geltungsbereich der DV 301 statt mit der Vorsignaltafel gekennzeichnet sein?", "answer": "Mit einem Vorsignalmastschild: ein mit der Spitze nach unten weisendes gelbes Dreieck. Das Mastschild ist rückstrahlend.", "sig": ["ne2_mast"]}, {"difficulty": "schwer", "group": "Ne", "question": "Wofür kann Ne 3 zusätzlich aufgestellt sein?", "answer": "Das Signal kann auch zur Ankündigung einer allein stehenden Vorsignaltafel aufgestellt sein.", "sig": ["ne3"]}, {"difficulty": "schwer", "group": "Ne", "question": "Wie sind Vorsignalbaken (Ne 3) beschaffen und wo stehen sie?", "answer": "Hohe rechteckige Tafeln; bei beschränktem Raum niedrige rechteckige oder quadratische Tafeln. Sie stehen in der Regel nur auf Hauptbahnen.", "sig": ["ne3"]}, {"difficulty": "schwer", "group": "Ne", "question": "In welchem Abstand stehen die Vorsignalbaken?", "answer": "In der Regel drei, in Ausnahmefällen weniger oder bis zu fünf Baken vor dem Vorsignal. Die in der Fahrtrichtung letzte Bake steht 100 m vor dem Vorsignal, die anderen in je 75 m Abstand. Bei Sichtbehinderung auch in anderen Abständen.", "sig": ["ne3"]}, {"difficulty": "schwer", "group": "Ne", "question": "Sind Vorsignalbaken in Tunneln rückstrahlend oder beleuchtet?", "answer": "Ja, Vorsignalbaken in Tunneln sind rückstrahlend oder beleuchtet.", "sig": ["ne3"]}, {"difficulty": "schwer", "group": "Ne", "question": "Welche Vorsignale werden nicht durch Baken angekündigt?", "answer": "Vorsignale von Zwischen- und Ausfahrsignalen und Vorsignale, die an einem Hauptsignal stehen oder mit diesem an einem Signalträger vereinigt sind, werden nur in Ausnahmefällen angekündigt. Vorsignalwiederholer und Wärtervorsignale werden nicht durch Baken angekündigt.", "sig": ["ne3"]}, {"difficulty": "schwer", "group": "Ne", "question": "Wie ist die erste Bake bei verkürztem Vorsignalabstand gekennzeichnet?", "answer": "Ist der Abstand eines Vorsignals vom Hauptsignal um mehr als 5 % kürzer als der Bremsweg der Strecke, trägt die erste Bake auf dem oberen Rand ein auf der Spitze stehendes weißes Dreieck mit schwarzem Rand. Bei beschränktem Raum kann es vor der Bake stehen. Im Geltungsbereich der DV 301 darf das Dreieck bis auf weiteres fehlen.", "sig": ["ne3_kurz"]}, {"difficulty": "schwer", "group": "Ne", "question": "Wo ist die Schachbretttafel (Ne 4) in der Regel aufgestellt?", "answer": "In der Regel an durchgehenden Hauptgleisen; an sonstigen Hauptgleisen kann sie aufgestellt sein. Sie steht in Höhe des Hauptsignals. Sie darf nicht aufgestellt werden, wenn durch weitere Hauptsignale in gleicher Höhe die Zuordnung nicht eindeutig ist.", "sig": ["ne4"]}, {"difficulty": "schwer", "group": "Ne", "question": "Was ist bei Ne 4 für die Form der Tafel festgelegt?", "answer": "Das Signal ist eine hohe rechteckige Tafel; bei beschränktem Raum ist eine niedrige Tafel aufgestellt.", "sig": ["ne4"]}, {"difficulty": "schwer", "group": "Ne", "question": "Worauf weist ein unmittelbar rechts vom Gleis stehendes Ne 4 hin?", "answer": "Auf ein Hauptsignal, das entweder unmittelbar links, mehr als 10 m rechts oder ein Gleis weiter rechts vom befahrenen Gleis steht.", "sig": ["ne4"]}, {"difficulty": "schwer", "group": "Ne", "question": "Worauf weist ein unmittelbar links vom Gleis stehendes Ne 4 hin?", "answer": "Auf ein Hauptsignal, das unmittelbar rechts vom befahrenen Gleis steht. Im Geltungsbereich der DS 301 auch auf ein Sperrsignal, das für Fahrten entgegen der gewöhnlichen Fahrtrichtung unmittelbar rechts vom befahrenen Gleis steht.", "sig": ["ne4"]}, {"difficulty": "schwer", "group": "Ne", "question": "Was gilt für Ne 4 bei Bauzuständen?", "answer": "Das unmittelbar links vom Gleis stehende Ne 4 kann auf ein Hauptsignal hinweisen, das ein Gleis weiter rechts vom befahrenen Gleis steht (in der La oder bei NE-Bahnen in einer betrieblichen Anweisung bekannt gegeben). Das dazwischen befindliche Gleis kann zeitweise fehlen. Bei Bauzuständen und wenn der Betrieb es erfordert, ist das Signal rückstrahlend oder beleuchtet.", "sig": ["ne4"]}, {"difficulty": "schwer", "group": "Ne", "question": "Wo müssen Reisezüge mit Verkehrshalt an der Haltetafel (Ne 5) halten?", "answer": "An der Haltetafel. Ist sie hinter dem Bahnsteig aufgestellt, so, dass der erste Wagen nicht über den Bahnsteig hinaus steht.", "sig": ["ne5"]}, {"difficulty": "schwer", "group": "Ne", "question": "Was gilt, wenn Haltetafeln mit Zusatzschildern mit Längenangabe ergänzt sind?", "answer": "Es ist an der Haltetafel anzuhalten, an der die angegebene Länge gleich oder erstmals größer als die Zuglänge ist, spätestens an der Haltetafel ohne Zusatzschild. Das Eisenbahnverkehrsunternehmen darf eine andere Haltetafel bestimmen, sofern sich bei besetzten Reisezügen alle Einstiegstüren am Bahnsteig befinden.", "sig": ["ne5"]}, {"difficulty": "schwer", "group": "Ne", "question": "Wo halten haltende Züge auf Bahnhöfen ohne Ausfahrsignal?", "answer": "Haltende Züge (auch Güterzüge) an der Haltetafel, Reisezüge jedoch am Bahnsteig auch wenn dort keine Haltetafel aufgestellt ist.", "sig": ["ne5"]}, {"difficulty": "schwer", "group": "Ne", "question": "Wie kann die Anforderung eines Bedarfshalts angezeigt werden?", "answer": "Durch eine hochstehende, schwarze Rechteckscheibe mit weiß blinkendem „H“. Das Signal Ne 5 ist rückstrahlend oder beleuchtet, wenn der Betrieb es erfordert.", "sig": ["ne5b"]}, {"difficulty": "schwer", "group": "Ne", "question": "Wo kann die Haltetafel aufgestellt sein, und sind Abweichungen bekannt gegeben?", "answer": "Sie kann abweichend von Richtlinie 301.0002 Abschnitt 2 Absatz 3 aufgestellt sein. Diese Abweichungen sind nicht bekannt gegeben.", "sig": ["ne5"]}, {"difficulty": "schwer", "group": "Ne", "question": "Was kündigt Ne 6 an, und wo steht es?", "answer": "Haltepunkte oder Haltestellen, die infolge der örtlichen Verhältnisse schwer zu erkennen sind. Auf Hauptbahnen im Abstand des Bremsweges der Strecke, auf Nebenbahnen 150 m vor dem Bahnsteig.", "sig": ["ne6"]}, {"difficulty": "schwer", "group": "Ne", "question": "Ist Ne 6 rückstrahlend?", "answer": "Ja. Es darf vorübergehend nicht rückstrahlend sein.", "sig": ["ne6"]}, {"difficulty": "schwer", "group": "Ne", "question": "Für wen gilt die Schneepflugtafel (Ne 7)?", "answer": "Nur für Schneepflüge mit beweglichen Pflugscharen.", "sig": ["ne7aw"]}, {"difficulty": "schwer", "group": "Ne", "question": "Wo darf Ne 7 b abweichend aufgestellt sein, und wann kann darauf verzichtet werden?", "answer": "Ne 7 b darf auf eingleisiger Strecke unmittelbar links vom Gleis aufgestellt sein, wenn es sich am Träger des Signals Ne 7 a für die Gegenrichtung befindet. Auf die Aufstellung von Ne 7 b darf verzichtet werden, wenn das Ende des zu kennzeichnenden Gleisabschnittes durch das Signal Ne 7 a der Gegenrichtung erkennbar ist.", "sig": ["ne7bw"]}, {"difficulty": "schwer", "group": "Ne", "question": "Was hat der Triebfahrzeugführer am Standort von Ne 12 zu prüfen?", "answer": "Ob das Signal Ne 13 ein weißes Licht zeigt.", "sig": ["ne12"]}, {"difficulty": "schwer", "group": "Ne", "question": "Wird die Ankündigungsbake (Ne 12) bei Dunkelheit beleuchtet, und was gilt in Nebengleisen?", "answer": "Sie wird bei Dunkelheit nicht beleuchtet. Für Rückfallweichen in Nebengleisen werden keine Signale Ne 12 aufgestellt.", "sig": ["ne12"]}, {"difficulty": "schwer", "group": "Ne", "question": "Welche Teile von Ne 13a und Ne 13b sind rückstrahlend?", "answer": "Der orangefarbene waagerechte Streifen und das orange-weiß schräg gestreifte Mastschild.", "sig": ["ne13a", "ne13b"]}, {"difficulty": "schwer", "group": "Ne", "question": "Wie darf die Rückfallweiche bei Ne 13b befahren werden?", "answer": "Mit Schrittgeschwindigkeit erst, nachdem an Ort und Stelle – ggf. nach dem Aufschließen der Verschlusseinrichtungen und dem probeweisen Umstellen der Weiche von Hand – die Befahrbarkeit der Weiche festgestellt wurde.", "sig": ["ne13b"]}, {"difficulty": "schwer", "group": "Ne", "question": "Wie wird angezeigt, wenn mehrere Rückfallweichen auf ein Ne 13 folgen, die gegen die Spitze befahren werden?", "answer": "Am Mastschild des Signals durch eine schwarze Ziffer. Die Verhaltensregeln gelten dann für die angegebene Anzahl von Rückfallweichen.", "sig": ["ne13a"]}, {"difficulty": "schwer", "group": "Ne", "question": "Was ist zu tun, wenn am Überwachungssignal Ne 13b gezeigt wird?", "answer": "Dies ist sofort dem Fahrdienstleiter bzw. dem Zugleiter zu melden.", "sig": ["ne13b"]}, {"difficulty": "schwer", "group": "Ne", "question": "Für welches Gleis gilt Ne 14, und wie weist der Pfeil?", "answer": "Für das Gleis, auf das der Pfeil weist. Der Pfeil zeigt bei Anordnung links vom Gleis nach rechts, über dem Gleis nach unten, rechts vom Gleis nach links.", "sig": ["ne14r", "ne14d", "ne14"]}, {"difficulty": "schwer", "group": "Ne", "question": "Womit ist Ne 14 versehen?", "answer": "Mit der eindeutigen Kennzeichnung der ETCS-Blockstelle (z. B. 12345).", "sig": ["ne14id"]}, {"difficulty": "schwer", "group": "Ne", "question": "Wofür gebietet ein alleinstehendes Ne 14 Halt?", "answer": "Für Züge, die nicht in der ETCS-Betriebsart FS oder OS verkehren, für Rangierfahrten und für Kleinwagenfahrten.", "sig": ["ne14"]}, {"difficulty": "mittel", "group": "Si", "question": "Situation: Das Lichthauptsignal zeigt Hp 2, ein Zs 3 ist nicht vorhanden. Wie schnell darfst du fahren?", "answer": "Höchstens 40 km/h im anschließenden Weichenbereich – sofern dies nicht durch andere Signale (z. B. Zs 3) oder Einträge im Buchfahrplan bzw. in der La verschärft oder gelockert ist.", "sig": ["hp2_licht"]}, {"difficulty": "mittel", "group": "Si", "question": "Situation: Hauptsignal Hp 2, darunter Zs 3 mit Kennziffer 6. Was gilt?", "answer": "Fahrt. Das Zs 3 lockert Hp 2: Vom Signal ab darf im anschließenden Weichenbereich höchstens 60 km/h gefahren werden (Kennziffer × 10).", "sig": ["hp2_licht", "zs3l"]}, {"difficulty": "mittel", "group": "Si", "question": "Situation: Das Hauptsignal zeigt Ks 1, darunter ein Zs 3 mit Kennziffer 6. Was gilt?", "answer": "Fahrt. Vom Signal ab darf im anschließenden Weichenbereich die Geschwindigkeit von 60 km/h nicht überschritten werden.", "sig": ["ks1_haupt", "zs3l"]}, {"difficulty": "schwer", "group": "Si", "question": "Situation: Am Signal leuchtet Ks 1 und eine gelbe Kennziffer 8 (Zs 3v). Was bedeutet das?", "answer": "Fahrt; am nächsten Hauptsignal ist ein Geschwindigkeitsanzeiger Zs 3 mit 80 km/h zu erwarten. Die Geschwindigkeit ist so zu verringern, dass ab dem Zs 3 höchstens 80 km/h gefahren werden.", "sig": ["ks1_haupt", "zs3vl"]}, {"difficulty": "schwer", "group": "Si", "question": "Situation: Hauptsignal Ks 2, darunter Zs 3 mit Kennziffer 4. Was gilt?", "answer": "Die Vorbeifahrt am Hauptsignal ist erlaubt, am nächsten Hauptsignal ist Halt zu erwarten. Vom Signal ab darf im anschließenden Weichenbereich höchstens 40 km/h gefahren werden.", "sig": ["ks2_haupt_vf", "zs3l"]}, {"difficulty": "schwer", "group": "Si", "question": "Situation: Am Hauptsignal Ks 1 steht ein Lf 7 mit Kennziffer 8, darunter leuchtet zusätzlich Zs 3 mit Kennziffer 6. Welche Geschwindigkeit gilt ab dem Signal?", "answer": "60 km/h aus dem Zs 3 im anschließenden Weichenbereich. Ein am Hauptsignal aufgestelltes Lf 7 gilt nur bei Hp 1, Ks 1 ohne Zs 3 oder Ks 2 ohne Zs 3 – hier also nicht.", "sig": ["ks1_haupt", "zs3l", "lf7"]}, {"difficulty": "mittel", "group": "Si", "question": "Situation: Am Hauptsignal Hp 1 steht ein Lf 7 mit Kennziffer 8. Was gilt?", "answer": "Fahrt; vom Signal ab darf 80 km/h nicht überschritten werden. Ein am Hauptsignal aufgestelltes Lf 7 gilt bei Hp 1.", "sig": ["hp1_licht", "lf7"]}, {"difficulty": "mittel", "group": "Si", "question": "Situation: Das Hauptsignal zeigt Hp 0, zusätzlich leuchtet Zs 1. Was darfst du tun?", "answer": "Am Signal Hp 0 ohne schriftlichen Befehl vorbeifahren. Das Ersatzsignal gilt auch, wenn es erlischt, bevor die Zugspitze am Signal vorbeigefahren ist.", "sig": ["hp0_licht1", "zs1"]}, {"difficulty": "mittel", "group": "Si", "question": "Situation: Das Hauptsignal zeigt Hp 0, zusätzlich leuchten drei gelbe Lichter in V-Form. Was gilt?", "answer": "Zs 7 (Vorsichtssignal): am Signal Hp 0 ohne schriftlichen Befehl vorbeifahren, Weiterfahrt auf Sicht bis zum nächsten Hauptsignal. Das Signal gilt auch, wenn es erlischt.", "sig": ["hp0_licht1", "zs7"]}, {"difficulty": "schwer", "group": "Si", "question": "Situation: Hp 0 am Hauptsignal, darunter blinken drei weiße Lichter in A-Form. Was gilt?", "answer": "Zs 8 (Gegengleisfahrt-Ersatzsignal): am Halt zeigenden oder gestörten Hauptsignal vorbeifahren; der Fahrweg führt in das Streckengleis entgegen der gewöhnlichen Fahrtrichtung.", "sig": ["hp0_licht1", "zs8"]}, {"difficulty": "schwer", "group": "Si", "question": "Situation: Hp 0 und gleichzeitig Sh 1 am Lichthauptsignal. Für wen gilt das, und darf ein Zug fahren?", "answer": "Sh 1 in Verbindung mit Hp 0 zeigt an, dass das Haltegebot für Rangierfahrten aufgehoben ist. Für Zugfahrten gilt weiterhin Hp 0 – Halt.", "sig": ["hp0_licht1", "sh1l"]}, {"difficulty": "mittel", "group": "Si", "question": "Situation: Vorsignal Vr 2, danach Hauptsignal Hp 2 ohne Zs 3. Was erwartest du und was gilt am Hauptsignal?", "answer": "Am Vorsignal: Langsamfahrt erwarten. Am Hauptsignal: Langsamfahrt – höchstens 40 km/h im anschließenden Weichenbereich (wenn nicht anders angeordnet).", "sig": ["vr2_licht", "hp2_licht"]}, {"difficulty": "schwer", "group": "Si", "question": "Situation: Du fährst mit Hp 2 (40 km/h) in den Weichenbereich. Noch vor dessen Ende steht ein alleinstehendes Zs 10. Was bedeutet das?", "answer": "Die mit Hp 2 (oder Zs 3) vorgeschriebene Geschwindigkeitsbeschränkung ist bereits vor dem Ende des anschließenden Weichenbereichs aufgehoben (gilt nur für Zugfahrten, die durch Fahrtstellung eines Hauptsignals zugelassen wurden).", "sig": ["hp2_licht", "zs10l"]}, {"difficulty": "mittel", "group": "Si", "question": "Situation: Du passierst Lf 6 mit Kennziffer 7, später Lf 7 mit Kennziffer 7. Was gilt?", "answer": "Lf 6 kündigt ein Geschwindigkeitssignal an. Ab dem Lf 7 darf 70 km/h nicht überschritten werden.", "sig": ["lf6", "lf7"]}, {"difficulty": "mittel", "group": "Si", "question": "Situation: Am Hauptsignal Ks 1 leuchtet zusätzlich Zs 6. Was bedeutet das?", "answer": "Fahrt; der Fahrweg führt in das Streckengleis entgegen der gewöhnlichen Fahrtrichtung (Gegengleis).", "sig": ["ks1_haupt", "zs6l"]}, {"difficulty": "schwer", "group": "Si", "question": "Situation: Der Zug soll nach Ks 1 + Zs 3 „4“ fahren, im Weichenbereich steht ein alleinstehendes Zs 3 mit Kennziffer 6. Was gilt?", "answer": "Ab diesem Zs 3 gilt 60 km/h bis zum Ende des Weichenbereichs. Eine durch Hauptsignal oder Zs 3 vorgeschriebene Beschränkung kann durch ein alleinstehendes Zs 3 schon vor dem Ende des Weichenbereichs geändert werden.", "sig": ["ks1_haupt", "zs3l", "zs3f"]}, {"difficulty": "pzb", "group": "PZB", "question": "PZB-Leuchtmelder: Was zeigt diese Anzeige an?", "answer": "85 in Dauerlicht – PZB-Fahrzeugeinrichtung betriebsbereit.\n• Geschwindigkeit: Buchfahrplan Spalte 2 bzw. Signalgeschwindigkeit.", "sig": ["pzb_bereit"], "qsig": true}, {"difficulty": "pzb", "group": "PZB", "question": "PZB-Leuchtmelder: Was zeigt diese Anzeige an?", "answer": "85 blinkt.\n• Situation 1 (GT8-100-2S): keine Daten – sie kommen nach 40 m Fahrstrecke zustande; dann Buchfahrplan (Sp. 2) oder Signalgeschwindigkeit.\n• Situation 2: 700 m nach einer 1000-Hz-Beeinflussung abgefahren.\n• Geschwindigkeit: unter 85 km/h.\n• Befreien möglich: Fahrbegriff > 30 km/h und in den nächsten 550 m keine 500-Hz-Beeinflussung.", "sig": ["pzb_85b"], "qsig": true}, {"difficulty": "pzb", "group": "PZB", "question": "PZB-Leuchtmelder: Was zeigt diese Anzeige an?", "answer": "1000 Hz an, 85 blinkt – 1000-Hz-Beeinflussung (VÜ 1), vorher „PZB-Wachsam“ bedient.\n• V-Überwachung: unter 85 km/h.\n• Weiterer wirksamer 1000-Hz-Magnet während der Überwachung: Abarbeitung läuft im Hintergrund, Wachsam erneut betätigen → Wegüberwachung weitere 1250 m; LM 1000 Hz erlischt nach Loslassen der Taste kurz (0,5 s).", "sig": ["pzb_vue1"], "qsig": true}, {"difficulty": "pzb", "group": "PZB", "question": "PZB-Leuchtmelder: Was zeigt diese Anzeige an?", "answer": "1000 Hz an, 85/70 Wechselblinken – VÜ 2 (Späthalt).\n• Entsteht: in fortgeschrittener 1000-Hz-Beeinflussung ab 501 m bis 700 m angehalten und mind. 15 s Umschaltgeschwindigkeit unterschritten.\n• V-Überwachung: unter 45 km/h.\n• 500-Hz-Magnet darf mit 45 km/h befahren werden, dann sofort innerhalb 153 m unter 25 km/h absenken.", "sig": ["pzb_vue2"], "qsig": true}, {"difficulty": "pzb", "group": "PZB", "question": "PZB-Leuchtmelder: Was zeigt diese Anzeige an?", "answer": "85/70 Wechselblinken, ohne 1000 Hz.\n• Situation 1: offene VÜ 2 (Späthalt) nach 700 m „abgefahren“.\n• Situation 2: Startprogramm in neu aufgerüstetem Führerstand.\n• Geschwindigkeit: unter 45 km/h.\n• Befreien möglich: Fahrbegriff > 30 km/h und in den nächsten 550 m keine 500-Hz-Beeinflussung.", "sig": ["pzb_vue2o"], "qsig": true}, {"difficulty": "pzb", "group": "PZB", "question": "PZB-Leuchtmelder: Was zeigt diese Anzeige an?", "answer": "1000 Hz an, 85/70 Gleichblinken – VÜ 3 (Frühhalt).\n• Entsteht: nach 1000-Hz-Beeinflussung bis 500 m angehalten und 15 s Umschaltgeschwindigkeit unterschritten.\n• V-Überwachung: unter 65 km/h, bis insgesamt 800 m abgefahren sind.", "sig": ["pzb_vue3"], "qsig": true}, {"difficulty": "pzb", "group": "PZB", "question": "PZB-Leuchtmelder: Was zeigt diese Anzeige an?", "answer": "85/70 Gleichblinken, ohne 1000 Hz.\n• Offene VÜ 3 (Frühhalt) nach 800 m „abgefahren“.\n• Geschwindigkeit: unter 65 km/h.\n• Befreien möglich: Fahrbegriff > 30 km/h und in den nächsten 550 m keine 500-Hz-Beeinflussung.", "sig": ["pzb_vue3o"], "qsig": true}, {"difficulty": "pzb", "group": "PZB", "question": "PZB-Leuchtmelder: Was zeigt diese Anzeige an?", "answer": "500 Hz an, 85/70 Wechselblinken.\n• Situation 1: Anfahrt nach Halt, wenn zuvor ein wirksamer 500-Hz-Gleismagnet befahren wurde.\n• Situation 2: VÜ 2 (Späthalt) wurde in eine 500-Hz-Beeinflussung „übergeben“ und wirkt im Vordergrund.\n• V-Überwachung: 25 km/h.", "sig": ["pzb_500"], "qsig": true}, {"difficulty": "oz", "group": "Oz", "question": "Orientierungszeichen: Was bedeutet dieses Zeichen?", "answer": "Schild „Automatik-HET“.\n• Steht an der Zugeinwirkungsstelle für die automatische Hilfseinschaltung von Bahnübergangssicherungsanlagen.\n• Vergleiche: „HET“ = Bedienstelle für die Hilfseinschaltung.", "sig": ["oz_ahet"], "qsig": true}, {"difficulty": "oz", "group": "Oz", "question": "Orientierungszeichen: Was bedeutet dieses Zeichen?", "answer": "Schild „HET“.\n• Steht an der Bedienstelle für die Hilfseinschaltung von Bahnübergangssicherungsanlagen.\n• Vergleiche: „Automatik-HET“ = Zugeinwirkungsstelle für die automatische Hilfseinschaltung.", "sig": ["oz_het"], "qsig": true}, {"difficulty": "oz", "group": "Oz", "question": "Orientierungszeichen: Was bedeutet dieses Zeichen?", "answer": "Schild „Automatik-ET“.\n• Steht an der Zugeinwirkungsstelle für die automatische Einschaltung von Bahnübergangssicherungsanlagen.\n• Vergleiche: „ET“ = Bedienstelle für die Einschaltung.", "sig": ["oz_aet"], "qsig": true}, {"difficulty": "oz", "group": "Oz", "question": "Orientierungszeichen: Was bedeutet dieses Zeichen?", "answer": "Schild „ET“.\n• Steht an der Bedienstelle für die Einschaltung von Bahnübergangssicherungsanlagen.\n• Vergleiche: „Automatik-ET“ = Zugeinwirkungsstelle für die automatische Einschaltung.", "sig": ["oz_et"], "qsig": true}, {"difficulty": "oz", "group": "Oz", "question": "Orientierungszeichen: Was bedeutet dieses Zeichen?", "answer": "Fahrtanzeiger – der Fahrdienstleiter stimmt der Abfahrt des Zuges zu.\n• a) Von links nach rechts steigender Lichtstreifen: Zustimmung gilt in Blickrichtung.\n• b) Drei von rechts nach links steigende Lichtpunkte: Zustimmung gilt entgegen der Blickrichtung.\n• Bei bestehenden Anlagen kann statt der Lichtpunkte ein senkrechter Lichtstreifen gezeigt werden.", "sig": ["oz_fa_a", "oz_fa_b"], "qsig": true}, {"difficulty": "oz", "group": "Oz", "question": "Orientierungszeichen: Was bedeutet dieses Zeichen?", "answer": "Hinweistafel auf Zp 9-Bedienstelle.\n• Weist auf die Stelle, an der die Bedieneinrichtung für das Lichtsignal Zp 9 aufgestellt oder angebracht ist.", "sig": ["oz_zp9"], "qsig": true}, {"difficulty": "oz", "group": "Oz", "question": "Orientierungszeichen: Was bedeutet dieses Zeichen?", "answer": "LZB-Bereichskennzeichen.\n• Kennzeichnet den Anfang einer LZB-Strecke.\n• Und den Übergang zwischen zwei Linienleiterschleifenbereichen unterschiedlicher Bereichskennungen – Bereichskennungswechsel (BKW).", "sig": ["oz_lzb"], "qsig": true}, {"difficulty": "oz", "group": "Oz", "question": "Orientierungszeichen: Was bedeutet dieses Zeichen?", "answer": "Blockkennzeichen.\n• An Blockstellen, die nicht durch den Standort eines Hauptsignals oder eines Signals Ne 14 gekennzeichnet sind.\n• a) Blocknummer im Kreis; b) Pfeil mit Blocknummer (ETCS location marker) – gilt für das Gleis, auf das der Pfeil weist.", "sig": ["oz_block_a", "oz_block_b"], "qsig": true}, {"difficulty": "oz", "group": "Oz", "question": "Orientierungszeichen: Was bedeutet dieses Zeichen?", "answer": "Hektometerzeichen – Kennzeichnung der Streckenkilometrierung.\n• Obere Zahl: Kilometer, untere Zahl: Hektometer.", "sig": ["oz_hekto"], "qsig": true}, {"difficulty": "oz", "group": "Oz", "question": "Orientierungszeichen: Was bedeutet dieses Zeichen?", "answer": "NBÜ-Kennzeichen.\n• Das Hektometerzeichen ist am oberen und unteren Rand durch einen orangefarbenen waagerechten Streifen ergänzt.", "sig": ["oz_nbue"], "qsig": true}, {"difficulty": "oz", "group": "Oz", "question": "Orientierungszeichen: Was bedeutet dieses Zeichen?", "answer": "Bezeichnungstafel für Tunnel.\n• Örtliche Tunnelbezeichnung: Name des Tunnels ohne das Wort/den Wortteil „Tunnel“, Tunnelsymbol, Länge in Metern.\n• Tunnel sind am Portal durch den Tunnelnamen gekennzeichnet; bei Tunneln unter 500 m kann darauf verzichtet sein.", "sig": ["oz_tunnel"], "qsig": true}, {"difficulty": "oz", "group": "Oz", "question": "Orientierungszeichen: Was bedeutet dieses Zeichen?", "answer": "Unbesetzte Fernsprechstelle (Buchstabe F).\n• Sprechstellen in Tunneln können zusätzlich ein Hörersymbol tragen.\n• Bis auf weiteres auch: Fo, F-Sig, Signalfernsprecher.", "sig": ["oz_f"], "qsig": true}, {"difficulty": "oz", "group": "Oz", "question": "Orientierungszeichen: Was bedeutet dieses Zeichen?", "answer": "Pfeil für Hinweis auf nächste Sprechstelle.\n• Auf der freien Strecke weist der Pfeil auf die nächste Sprechstelle hin.", "sig": ["oz_pfeil"], "qsig": true}, {"difficulty": "oz", "group": "Oz", "question": "Orientierungszeichen: Was bedeutet dieses Zeichen?", "answer": "Schild „Elektrische Streckentrennung“ (Anfang / Ende).\n• Kennzeichnet – soweit notwendig – offene Streckentrennungen von Speisebezirksgrenzen des Oberleitungsnetzes.", "sig": ["oz_trenn_a", "oz_trenn_e"], "qsig": true}, {"difficulty": "oz", "group": "Oz", "question": "Orientierungszeichen: Was bedeutet dieses Zeichen?", "answer": "Beginn Ortsstellbereich – weiße rechteckige Tafel „OB“.\n• Kennzeichnet den Übergang von einem Stellwerksbereich in einen Ortsstellbereich.\n• Das Zeichen kann aufgestellt sein.", "sig": ["oz_ob"], "qsig": true}, {"difficulty": "oz", "group": "Oz", "question": "Orientierungszeichen: Was bedeutet dieses Zeichen?", "answer": "Orientierungszeichen „PZB Bü“.\n• Kennzeichnet die Lage eines Gleismagneten 2000 Hz vor einem Bahnübergang.\n• Schwarz umrandete Tafel: weißes Feld „PZB“, darunter gelbes Feld mit „Bü“ und der Kilometerangabe des Bahnübergangs.", "sig": ["oz_pzb_bue"], "qsig": true}, {"difficulty": "oz", "group": "Oz", "question": "Orientierungszeichen: Was bedeutet dieses Zeichen?", "answer": "Orientierungszeichen „PZB 2000 Hz“.\n• Kennzeichnet die Lage eines Gleismagneten 2000 Hz, der nicht am Standort eines Hauptsignals angeordnet ist.\n• Schwarz umrandete Tafel: weißes Feld „PZB“, darunter weißes Feld „2000 Hz“.", "sig": ["oz_pzb_2000"], "qsig": true}, {"difficulty": "oz", "group": "Oz", "question": "Orientierungszeichen: Was bedeutet dieses Zeichen?", "answer": "Orientierungszeichen „Zuglänge“.\n• An Bahnsteigen ohne Haltetafel (Ne 5): kennzeichnet den verkehrlich günstigsten Halteplatz des Zuges.\n• Weißes rechteckiges Schild, schwarzer Rand, Längenangabe in Metern.\n• Das Verkehrsunternehmen bestimmt, welche Zeichen „Zuglänge“ beachtet werden.", "sig": ["oz_zuglaenge"], "qsig": true}, {"difficulty": "oz", "group": "Oz", "question": "Hebelgewicht an mechanisch ortsgestellter Weiche: Was bedeutet diese Kennzeichnung?", "answer": "Grundstellung (oben weiß, unten schwarz).", "sig": ["oz_h_grund"], "qsig": true}, {"difficulty": "oz", "group": "Oz", "question": "Hebelgewicht an mechanisch ortsgestellter Weiche: Was bedeutet diese Kennzeichnung?", "answer": "Nur mit Zustimmung des Wärters umstellen (oben weiß mit „W“, u /* ---- PZB 90: Leuchtmelderblock „I60R“ und Display EBI Cab 500 ---- */
// Zustände: 0 aus, 1 Dauerlicht, 2 blinkt (Phase A), 3 blinkt (Phase B, für Wechselblinken)
function pzbLamp(x, y, w, h, onFill, onInk, label, st, small) {
  const off = '#cfd6dc', offInk = '#9aa3ab';
  const lit = st > 0;
  const anim = st >= 2 ? `<animate attributeName="opacity" values="1;0.12" keyTimes="0;0.5" dur="1s" calcMode="discrete" repeatCount="indefinite" begin="${st === 3 ? '-0.5s' : '0s'}"/>` : '';
  const lines = label.split('|');
  const fs = small ? 9 : (lines.length > 1 ? 10 : 17);
  const t = lines.map((l, i) => `<text x="${x + w / 2}" y="${y + h / 2 + fs * 0.36 + (i - (lines.length - 1) / 2) * (fs + 1)}" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="${fs}" fill="${lit ? onInk : offInk}">${l}</text>`).join('');
  return `<rect x="${x - 3}" y="${y - 3}" width="${w + 6}" height="${h + 6}" rx="3" fill="#1b1b1b"/>` +
    `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${off}"/>` +
    (lit ? `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${onFill}"/>${t}${anim}</g>` : t) + pzbX(x, y, w, h, st);
}
// Blinkende Melder wie in den Unterlagen mit einem Kreuz markiert (blau = blinkt, grau = blinkt im Wechsel)
function pzbX(x, y, w, h, st) {
  if (st < 2) return '';
  const c = st === 3 ? 'rgba(150,160,170,.85)' : 'rgba(80,140,230,.85)';
  return `<path d="M${x - 6} ${y - 6} L${x + w + 6} ${y + h + 6} M${x + w + 6} ${y - 6} L${x - 6} ${y + h + 6}" stroke="${c}" stroke-width="4" stroke-linecap="round"/>`;
}
function pzbSvg(o) {
  // o: { l85, l70, l1000, l500, v }
  const BL = '#1565d8';
  let g = `<rect x="4" y="4" width="132" height="184" rx="6" fill="#6f7377" stroke="#3d4043" stroke-width="2"/>`;
  g += pzbLamp(18, 16, 44, 34, BL, '#fff', '85', o.l85 || 0);
  g += pzbLamp(78, 16, 44, 34, BL, '#fff', '70', o.l70 || 0);
  g += pzbLamp(18, 60, 44, 34, '#f7e14b', '#141414', '1000|Hz', o.l1000 || 0);
  g += pzbLamp(78, 60, 44, 34, '#e53935', '#fff', '500|Hz', o.l500 || 0);

function seedCard(c, i) {

function readImage(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('read'));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => rej(new Error('img'));
      im.onload = () => {
        const sc = Math.min(1, 900 / Math.max(im.width, im.height));
        const w = Math.max(1, Math.round(im.width * sc)), h = Math.max(1, Math.round(im.height * sc));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(im, 0, 0, w, h);
        res(cv.toDataURL('image/jpeg', 0.82));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in props || {}) {
    const v = props[k];
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');

const TEST_N = 20;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function buildTest(d) {
  const pool = state.cards.filter(c => c.d === d);
  state.tseen = state.tseen || {};
  const used = new Set(state.tseen[d] || []);
  const fresh = pool.filter(c => !used.has(c.id));
  let picked;
  if (fresh.length >= TEST_N) {
    picked = shuffle(fresh).slice(0, TEST_N);
    state.tseen[d] = [...used].concat(picked.map(c => c.id));
  } else { // Rest der neuen Fragen, dann Auffüllen aus dem Pool: ein neuer Durchgang beginnt
    const top = shuffle(pool.filter(c => used.has(c.id))).slice(0, TEST_N - fresh.length);
    picked = shuffle(fresh).concat(top);
    state.tseen[d] = top.map(c => c.id);
  }
  save();
  return picked.map(c => {
    const seen = new Set([c.a.trim()]);
    const same = shuffle(pool.filter(x => x.id !== c.id && gKey(x.g) === gKey(c.g)));
    const rest = shuffle(pool.filter(x => x.id !== c.id && gKey(x.g) !== gKey(c.g)));
    const wrong = [];
    for (const x of [...same, ...rest]) {
      const t = x.a.trim();
      if (seen.has(t)) continue;
      seen.add(t); wrong.push(t);
      if (wrong.length === 3) break;
    }
    const opts = shuffle([{ text: c.a, ok: true }, ...wrong.map(t => ({ text: t, ok: false }))]);
    return { id: c.id, opts, pick: -1, pic: Math.random() < 0.5 };
  });
}
// Leicht-Frage „Bü 0 – Was bedeutet das Signal?“: im Test zufällig nur Bild oder nur Kurzname
function nameQ(c) {
  if (c.d !== 'leicht' || !(c.sig || []).some(k => SIG[k]) && !c.img) return null;
  const i = c.q.indexOf(' – ');
  if (i < 1) return null;
  const rest = c.q.slice(i + 3);
  if (!/^Was bedeutet/i.test(rest)) return null;
  const short = c.q.slice(0, i).replace(/\s*\(.*\)\s*$/, '').trim();
  if (!short || short.length > 14) return null;
  return { short, rest };
}

/* ---- Design: Auto / Hell / Dunkel ---- */
const THEME_KEY = 'signal-karteikarten.theme';
const THEMES = [{ k: 'auto', l: '◐ Auto' }, { k: 'light', l: '☀ Hell' }, { k: 'dark', l: '☾ Dunkel' }];
let theme = 'auto';
try { theme = localStorage.getItem(THEME_KEY) || 'auto'; } catch (e) {}
function applyTheme() {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
  const t = THEMES.find(x => x.k === theme) || THEMES[0];
  $('themeBtn').textContent = t.l;
  $('themeBtn').setAttribute('aria-label', 'Design: ' + t.l.slice(2) + ' (tippen zum Wechseln)');
}
$('themeBtn').addEventListener('click', () => {
  const i = THEMES.findIndex(x => x.k === theme);
  theme = THEMES[(i + 1) % THEMES.length].k;
  try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
  applyTheme();
});
applyTheme();

/* ---- Schreibtest: Kurzbezeichnung, Langbezeichnung, Beschreibung ---- */
const normT = t => String(t || '').toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/[^a-z0-9]/g, '');
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function signalNames(c) {
  const m = /^(.+?)\s+–\s+Was bedeutet/i.exec(c.q);
  if (!m) return null;
  let head = m[1].trim(), lang = '';
  const mm = /^(.*?)\s*\((.+)\)\s*$/.exec(head);
  if (mm) { head = mm[1].trim(); lang = mm[2].replace(/,\s*D[SV] 301$/, '').trim(); }
  if (!head || head.length > 26) return null;
  return { kurz: head, kurzAlt: head.split('/').map(x => x.trim()).filter(Boolean), lang, langAlt: lang ? lang.split(/,|\//).map(x => x.trim()).filter(Boolean) : [] };
}
const writePool = () => state.cards.filter(c => c.d === 'leicht' && gKey(c.g) !== 'PZB' && gKey(c.g) !== 'Oz' && c.a && ((c.sig || []).some(k => SIG[k]) || c.img) && signalNames(c));
function buildWrite() {
  const pool = writePool();
  state.tseen = state.tseen || {};
  const used = new Set(state.tseen.schreib || []);
  const fresh = pool.filter(c => !used.has(c.id));
  let picked;
  if (fresh.length >= TEST_N) { picked = shuffle(fresh).slice(0, TEST_N); state.tseen.schreib = [...used].concat(picked.map(c => c.id)); }
  else {
    const topup = shuffle(pool.filter(c => used.has(c.id))).slice(0, TEST_N - fresh.length);
    picked = shuffle(fresh).concat(topup); state.tseen.schreib = topup.map(c => c.id);
  }
  save();
  return picked.map(c => ({ id: c.id, kurz: '', lang: '', desc: '', checked: false, rate: -1 }));
}
function matchName(input, alts) {
  const v = normT(input);
  if (!v) return 0;
  for (const a of alts) {
    const t = normT(a);
    if (v === t) return 2;
    if (t.length >= 6 && lev(v, t) <= Math.max(1, Math.floor(t.length / 8))) return 1; // kleiner Tippfehler
  }
  return 0;
}
const STOP = new Set('eine einer einem einen eines oder und mit ohne über unter nach auf dem den der die das des von vom zum zur ist sind wird werden kann können bzw sowie auch beim bei dass einem zwei drei'.split(' '));
function keyWords(t) {
  const out = [];
  for (const w of String(t).toLowerCase().split(/[^a-zäöüß0-9-]+/)) {
    if (w.length < 4 || STOP.has(w)) continue;
    if (!out.includes(w)) out.push(w);
  }
  return out;
}
function writeScore(q) {
  const c = byId(q.id), nm = c && signalNames(c);
  if (!nm) return [0, 0];
  let r = matchName(q.kurz, nm.kurzAlt) ? 1 : 0, n = 1;
  if (nm.lang) { n++; if (matchName(q.lang, nm.langAlt)) r++; }
  n++; r += q.rate === 2 ? 1 : q.rate === 1 ? 0.5 : 0;
  return [r, n];
}
function writePanel() {
  const top = extra => el('div', { class: 'ptop' }, el('span', { class: 'badge' }, 'Schreibtest'), extra || el('span'),
    el('button', { class: 'icon-btn', type: 'button', style: 'margin-left:auto', 'aria-label': 'Schließen', onclick: closeView }, '×'));
  const panel = (t, body, foot) => el('div', { class: 'panel', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Schreibtest' }, t, el('div', { class: 'pbody' }, ...body), foot);
  if (view.phase === 'done') {
    let R = 0, N = 0; const rows = [];
    for (const q of view.qs) { const [r, n] = writeScore(q); R += r; N += n; if (r < n) rows.push({ q, r, n }); }
    if (!view.rec) {
      view.rec = true;
      const g = {};
      for (const q of view.qs) { const c = byId(q.id); const k = c ? gKey(c.g) : 'Eigene'; const [r, n] = writeScore(q); g[k] = g[k] || [0, 0]; g[k][0] += r; g[k][1] += n; }
      state.tstats = state.tstats || []; state.tstats.push({ t: Date.now(), d: 'schreib', r: R, n: N, g }); save();
    }
    const fmt = x => String(Math.round(x * 10) / 10).replace('.', ',');
    return panel(top(), [
      el('div', null, el('span', { class: 'field-label' }, 'Ergebnis'), el('p', { class: 'res-big' }, fmt(R) + ' / ' + N), el('p', { class: 'note' }, Math.round(R / N * 100) + ' % der Punkte · je Signal: Kurzbezeichnung, Langbezeichnung, Bedeutung')),
      rows.length ? el('div', null, el('span', { class: 'field-label' }, 'Nicht ganz richtig'),
        el('ul', { class: 'wrong-list' }, ...rows.map(x => { const nm = signalNames(byId(x.q.id)); return el('li', null, nm.kurz + (nm.lang ? ' – ' + nm.lang : '') + ' (' + fmt(x.r) + '/' + x.n + ')'); }))) : el('p', null, 'Alles richtig!')],
      el('div', { class: 'pfoot' },
        rows.length ? el('button', { class: 'btn wide', type: 'button', onclick: () => { rows.forEach(x => { state.marked[x.q.id] = true; }); save(); toast(rows.length + ' Karten markiert ★'); renderMain(); } }, 'Diese Karten markieren ★') : null,
        el('div', { class: 'row' },
          el('button', { class: 'btn ghost wide', type: 'button', onclick: () => { view = { type: 'write', phase: 'run', qs: buildWrite(), i: 0 }; renderOverlay(); } }, 'Neuer Schreibtest'),
          el('button', { class: 'btn ghost wide', type: 'button', onclick: closeView }, 'Schließen'))));
  }
  const q = view.qs[view.i], c = byId(q.id), nm = signalNames(c);
  const ck = q.checked;
  const inp = (key, label, ph, area) => {
    const f = el(area ? 'textarea' : 'input', { class: 'winp', placeholder: ph, autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', disabled: ck, id: 'w-' + key });
    if (!area) f.type = 'text';
    f.value = q[key];
    f.addEventListener('input', () => { q[key] = f.value; });
    if (key === 'kurz') f.setAttribute('data-autofocus', '');
    return el('div', { class: 'wfield' }, el('label', { class: 'field-label', for: 'w-' + key }, label), f);
  };
  const verdict = (ok, txt) => el('div', { class: 'verdict ' + (ok ? 'ok' : 'bad') }, el('b', null, ok === 2 ? '✓ Richtig. ' : ok === 1 ? '✓ Fast richtig (Tippfehler). ' : '✗ Richtig wäre: '), txt);
  const body = [
    el('div', null, el('span', { class: 'field-label' }, 'Wie heißt dieses Signal, und was bedeutet es?')),
    looksBlock(c, 'Signal', true),
    inp('kurz', 'Kurzbezeichnung', 'z. B. Lf 7')];
  if (ck) { const m = matchName(q.kurz, nm.kurzAlt); body.push(verdict(m, m ? nm.kurz : nm.kurz)); }
  if (nm.lang) {
    body.push(inp('lang', 'Langbezeichnung', 'z. B. Geschwindigkeitssignal'));
    if (ck) { const m = matchName(q.lang, nm.langAlt); body.push(verdict(m, nm.lang)); }
  }
  body.push(inp('desc', 'Bedeutung (was bedeutet es?)', 'z. B. Die angezeigte Geschwindigkeit darf …', true));
  if (ck) {
    const kw = keyWords(c.a), have = normT(q.desc) ? kw.filter(w => q.desc.toLowerCase().includes(w)) : [];
    body.push(el('div', { class: 'verdict' }, el('b', null, 'Musterlösung: '), el('span', { style: 'white-space:pre-line' }, c.a)));
    body.push(el('p', { class: 'note' }, 'Stichwörter getroffen: ' + have.length + ' von ' + kw.length + (kw.length ? ' (' + Math.round(have.length / kw.length * 100) + ' %)' : '') + '. Vergleiche selbst und bewerte deine Antwort:'));
    body.push(el('div', { class: 'row' }, ...[['Falsch', 0], ['Teilweise', 1], ['Richtig', 2]].map(([l, v]) => el('button', {
      class: 'btn ' + (q.rate === v ? '' : 'ghost') + ' wide', type: 'button', 'aria-pressed': String(q.rate === v),
      onclick: () => { q.rate = v; renderOverlay(); }
    }, l))));
  }
  const last = view.i === view.qs.length - 1;
  const foot = el('div', { class: 'pfoot' }, !ck
    ? el('button', { class: 'btn wide', type: 'button', onclick: () => { q.checked = true; renderOverlay(); } }, 'Prüfen')
    : el('button', { class: 'btn wide', type: 'button', disabled: q.rate < 0, onclick: () => { if (last) view.phase = 'done'; else view.i++; renderOverlay(); } }, q.rate < 0 ? 'Erst Antwort bewerten' : last ? 'Ergebnis' : 'Weiter'));
  return panel(top(el('span', { class: 'pos' }, 'Signal ' + (view.i + 1) + '/' + view.qs.length)), body, foot);
}

function editPanel() {
  const isNew = view.id == null;
  const c = isNew ? { q: '', a: '' } : byId(view.id);
  const qf = el('textarea', { id: 'f-q', 'data-autofocus': '', placeholder: 'z. B. Lf 2 (Anfangscheibe) – Was bedeutet das Signal?' });
  qf.value = c.q;
  const af = el('textarea', { id: 'f-a', class: 'tall', placeholder: 'Antwort' });
  af.value = c.a;
  const seg = el('div', { class: 'seg', role: 'group', 'aria-label': 'Schwierigkeitsgrad' });
  const paintSeg = () => {
    seg.replaceChildren(...DIFFS.map(d => el('button', {
      type: 'button', 'aria-pressed': String(view.d === d.k),
      onclick: () => { view.d = d.k; paintSeg(); }
    }, el('span', { class: 'dot ' + d.k }), d.label)));
  };
  paintSeg();
  if (view.g === undefined) view.g = isNew ? (gfilter === 'alle' ? 'Eigene' : gfilter) : gKey(c.g);
  const gsel = el('select', { class: 'sel', id: 'f-g', 'aria-label': 'Block' }, ...GROUPS.map(x => el('option', { value: x.k }, x.k + ' – ' + x.t)));
  gsel.value = view.g;
  gsel.addEventListener('change', () => { view.g = gsel.value; });
  const msg = el('p', { class: 'msg', role: 'alert' });
  if (view.img === undefined) view.img = c.img || '';
  const imgBox = el('div', { class: 'imgfield' });
  const fileIn = el('input', { type: 'file', accept: 'image/*', id: 'f-img' });
  fileIn.addEventListener('change', () => {
    const f = fileIn.files && fileIn.files[0];
    if (!f) return;
    readImage(f).then(d => { view.img = d; msg.textContent = ''; paintImg(); })
      .catch(() => { msg.textContent = 'Das Bild konnte nicht gelesen werden. Bitte ein JPG oder PNG wählen.'; msg.style.color = 'var(--danger)'; })
      .finally(() => { fileIn.value = ''; });
  });
  const paintImg = () => {
    imgBox.replaceChildren(
      view.img && el('img', { src: view.img, alt: 'Vorschau des Signalbilds' }),
      el('div', { class: 'row', style: 'flex-wrap:wrap' },
        el('label', { class: 'btn ghost filebtn' }, view.img ? 'Anderes Bild wählen' : 'Bild wählen', fileIn),
        view.img && el('button', { class: 'btn ghost', type: 'button', onclick: () => { view.img = ''; paintImg(); } }, 'Bild entfernen')));
  };
  paintImg();
  const back = () => { if (view.back) { view = view.back; renderOverlay(); } else closeView(); };
  const delBtn = isNew ? null : el('button', {
    class: 'btn danger', type: 'button',
    onclick: e => {
      if (!view.armed) { view.armed = true; e.target.classList.add('armed'); e.target.textContent = 'Wirklich löschen?'; return; }
      state.cards = state.cards.filter(x => x.id !== view.id); delete state.known[view.id]; delete state.marked[view.id]; save();
      closeView(); toast('Karte gelöscht');
    }
  }, 'Löschen');
  return el('div', { class: 'panel', role: 'dialog', 'aria-modal': 'true', 'aria-label': isNew ? 'Neue Karte' : 'Karte bearbeiten' },
    el('div', { class: 'ptop' },
      el('span', { class: 'badge' }, isNew ? 'Neue Karte' : 'Karte bearbeiten'),
      el('button', { class: 'icon-btn', type: 'button', style: 'margin-left:auto', 'aria-label': 'Abbrechen', onclick: back }, '×')),
    el('form', { class: 'form pbody', onsubmit: e => e.preventDefault() },
      el('div', null, el('label', { class: 'field-label', for: 'f-q' }, 'Frage'), qf),
      el('div', null, el('label', { class: 'field-label', for: 'f-a' }, 'Antwort'), af),
      NOLEVEL[view.d] ? null : el('div', null, el('span', { class: 'field-label' }, 'Schwierigkeitsgrad'), seg),
      el('div', null, el('label', { class: 'field-label', for: 'f-g' }, 'Block'), gsel),
      el('div', null, el('span', { class: 'field-label' }, 'Bild des Signals (optional)'), imgBox,
        el('p', { class: 'note', style: 'margin-top:8px' }, 'Foto aus der Galerie oder mit der Kamera. Es erscheint auf der Karte unter der Antwort.')),
      msg),
    el('div', { class: 'pfoot' },
      el('div', { class: 'row' },
        delBtn,
        el('button', { class: 'btn ghost', type: 'button', onclick: back }, 'Abbrechen'),
        el('button', {
          class: 'btn wide', type: 'button',
          onclick: () => {
            const q = qf.value.trim(), a = af.value.trim();
            if (!q || !a) { msg.textContent = 'Bitte Frage und Antwort ausfüllen.'; msg.style.color = 'var(--danger)'; return; }
            if (isNew) {
              state.cards.push({ id: 'u' + Date.now().toString(36), d: view.d, g: gKey(view.g), q, a, img: view.img || '' });
              if (filter !== 'alle' && filter !== view.d) filter = 'alle';
              if (gfilter !== 'alle' && gfilter !== gKey(view.g)) gfilter = 'alle';
            } else {
              const t = byId(view.id); t.q = q; t.a = a; t.edited = true; t.d = view.d; t.g = gKey(view.g); t.img = view.img || '';
            }
            const ok = save(); closeView();
            toast(ok ? 'Karte gespeichert' : 'Speicher voll: die Änderung bleibt nur bis zum Schließen erhalten. Bild entfernen oder kleiner wählen.');
          }
        }, 'Speichern'))));
}

function exportJson() {
  return JSON.stringify(state.cards.map(c => {
    const o = { difficulty: c.d, group: gKey(c.g), question: c.q, answer: c.a };
    if (c.sig && c.sig.length) o.sig = c.sig;
    if (c.look) o.look = c.look;
    return o;
  }), null, 2);
}
function managePanel() {
  const exp = el('textarea', { class: 'tall', readonly: true, id: 'm-exp', 'aria-label': 'Export' });
  exp.value = exportJson();
  const imp = el('textarea', { class: 'tall', id: 'm-imp', placeholder: '[{"difficulty":"leicht","question":"…","answer":"…"}]' });
  const msg = el('p', { class: 'msg', role: 'status' });
  const say = (t, bad) => { msg.textContent = t; msg.style.color = bad ? 'var(--danger)' : 'var(--ink)'; };
  const norm = d => { d = String(d || '').toLowerCase(); return DIFFS.some(x => x.k === d) ? d : 'mittel'; };
  const resetAll = el('button', {
    class: 'btn danger', type: 'button',
    onclick: e => {
      if (!view.armed) { view.armed = true; e.target.classList.add('armed'); e.target.textContent = 'Wirklich alle eigenen Änderungen verwerfen?'; return; }
      state = fresh(); save(); closeView(); toast('Startkarten wiederhergestellt');
    }
  }, 'Auf Startkarten zurücksetzen');
  return el('div', { class: 'panel', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Karten verwalten' },
    el('div', { class: 'ptop' },
      el('span', { class: 'badge' }, 'Karten verwalten'),
      el('button', { class: 'icon-btn', type: 'button', style: 'margin-left:auto', 'aria-label': 'Schließen', onclick: closeView }, '×')),
    el('div', { class: 'pbody' },
      el('div', null,
        el('label', { class: 'field-label', for: 'm-exp' }, 'Sichern (Text kopieren)'),
        exp,
        el('p', { class: 'note', style: 'margin-top:8px' }, 'Eigene Bilder sind in diesem Text nicht enthalten.'),
        el('div', { class: 'row', style: 'margin-top:8px' },
          el('button', {
            class: 'btn ghost', type: 'button',
            onclick: () => {
              const done = () => say('Kopiert.');
              try { navigator.clipboard.writeText(exp.value).then(done, () => { exp.select(); say('Text markiert, bitte selbst kopieren.'); }); }
              catch (e) { exp.select(); say('Text markiert, bitte selbst kopieren.'); }
            }
          }, 'Kopieren'))),
      el('div', null,
        el('label', { class: 'field-label', for: 'm-imp' }, 'Karten hinzufügen (Text einfügen)'),
        imp,
        el('p', { class: 'note' }, 'Format: Liste mit difficulty (leicht, mittel, schwer), question und answer. Vorhandene Karten bleiben erhalten.'),
        el('div', { class: 'row', style: 'margin-top:8px' },
          el('button', {
            class: 'btn', type: 'button',
            onclick: () => {
              try {
                let data = JSON.parse(imp.value);
                if (data && !Array.isArray(data) && Array.isArray(data.cards)) data = data.cards;
                if (!Array.isArray(data)) throw new Error('liste');
                const add = data.filter(x => x && (x.question || x.q) && (x.answer || x.a)).map((x, i) => ({
                  id: 'u' + Date.now().toString(36) + i, d: norm(x.difficulty || x.d), g: gKey(x.group || x.g),
                  q: String(x.question || x.q).trim(), a: String(x.answer || x.a).trim(),
                  sig: Array.isArray(x.sig) ? x.sig.filter(k => SIG[k]) : [], look: x.look ? String(x.look) : ''
                }));
                if (!add.length) throw new Error('leer');
                state.cards.push(...add); save(); closeView(); toast(add.length + ' Karten hinzugefügt');
              } catch (e) { say('Der Text ist keine gültige Kartenliste.', true); }
            }
          }, 'Hinzufügen'))),
      el('div', { class: 'row', style: 'flex-wrap:wrap' },
        el('button', { class: 'btn ghost', type: 'button', onclick: () => { state.known = {}; state.marked = {}; save(); closeView(); toast('Fortschritt und Markierungen zurückgesetzt'); } }, 'Fortschritt zurücksetzen'),
        resetAll),
      msg),
    el('div', { class: 'pfoot' }, el('button', { class: 'btn ghost', type: 'button', onclick: closeView }, 'Fertig')));
}

$('addBtn').addEventListener('click', () => {
  view = { type: 'edit', id: null, d: filter === 'alle' ? 'leicht' : filter, armed: false };
  renderOverlay();
});
document.addEventListener('keydown', e => {
  if (!view) return;
  if (e.key === 'Escape') { if (view.type === 'edit' && view.back) { view = view.back; renderOverlay(); } else closeView(); return; }
  if (view.type !== 'study' || /^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName)) return;
  if (e.key === 'ArrowRight' && view.i < view.ids.length - 1) { view.i++; view.shown = false; renderOverlay(); }
  if (e.key === 'ArrowLeft' && view.i > 0) { view.i--; view.shown = false; renderOverlay(); }
});

renderMain();
